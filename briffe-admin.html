<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration · briffetools</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#141414;--panel-2:#181818;--line:#222;--line-2:#2a2a2a;--ink:#e8e8e0;--mut:#9a9a92;--mut-2:#6f6f68;--red:#b3242e;--ok:#22c55e;--warn:#f59e0b;--err:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:13px}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header a.back{color:var(--mut);text-decoration:none;font-size:12px}
header .brand{font-size:16px}header .brand b{font-weight:500}header .brand i{color:var(--red);font-style:normal}
header .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-left:6px}
main{max-width:1200px;margin:0 auto;padding:20px 24px 80px}
h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--warn);font-weight:500;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
th{border-top:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut-2);font-weight:400;line-height:1.3}
th.b,td.b{text-align:center;width:104px}
tr.off td{opacity:.45}
tr.adm td.b select{opacity:.35}
select,input{background:#0a0a0a;color:var(--ink);border:1px solid var(--line-2);border-radius:4px;padding:6px 7px;font:inherit;font-size:12px}
select:focus,input:focus{outline:none;border-color:var(--warn)}
td.b select{width:96px}
select.l-aucun{color:var(--mut-2)}select.l-lecteur{color:#93c5fd}select.l-editeur{color:#86efac}select.l-admin{color:#fca5a5}
button{background:transparent;color:var(--ink);border:1px solid var(--line-2);border-radius:4px;padding:6px 9px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mut)}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.name input{width:100%;min-width:130px}
.login{color:var(--mut);font-size:11px}
.msg{min-height:1.2em;margin-top:10px;font-size:12px;line-height:1.5}.msg.ok{color:var(--ok)}.msg.ko{color:var(--err)}
.new{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.new label{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;font-size:12px;line-height:1.6;color:#b0b0a8}
.legend b{color:var(--ink);font-weight:500}
.chkc{text-align:center}
.tag{font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(179,36,46,.25);color:#fca5a5;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:640px){main{padding:16px}header{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">&larr; Menu</a>
  <span class="brand"><b>briffe</b><i>tools</i></span><span class="sub">administration des accès</span>
</header>
<main id="app"><p style="color:var(--mut)">Chargement…</p></main>

<script src="briffe-auth.js"></script>
<script>
var LEVELS=[['aucun','—'],['lecteur','Lecture'],['editeur','Édition'],['admin','Admin']];
var USERS=[], BRIQUES=[], ME=null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
async function api(body){
  var r=await fetch('/.netlify/functions/users',{method:'POST',headers:BriffeAuth.headers({'Content-Type':'application/json'}),body:JSON.stringify(body)});
  var j=await r.json().catch(function(){ return {error:'Réponse inattendue ('+r.status+')'}; });
  if(r.status===401){ BriffeAuth.check(); }
  return j;
}
function msg(t,ok){ var m=document.getElementById('msg'); if(m){ m.className='msg '+(ok?'ok':'ko'); m.textContent=t||''; } }
function fmtDT(iso){ var d=new Date(iso); if(isNaN(d)) return 'jamais'; var p=function(n){return (n<10?'0':'')+n;}; return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+' '+p(d.getHours())+'h'+p(d.getMinutes()); }
function genPass(){ var c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint32Array(12),o=''; crypto.getRandomValues(a); for(var i=0;i<a.length;i++) o+=c[a[i]%c.length]; return o; }

BriffeAuth.ready.then(async function(me){
  ME=me;
  if(!me.is_admin){ document.getElementById('app').innerHTML='<div class="card"><p>Cette page est réservée aux administrateurs.</p><p><a href="index.html" style="color:var(--ink)">Retour au menu</a></p></div>'; return; }
  await load();
});
async function load(){
  var j=await api({action:'list'});
  if(!j.ok){ document.getElementById('app').innerHTML='<div class="card msg ko">'+esc(j.error||'Erreur')+'</div>'; return; }
  USERS=j.users; BRIQUES=j.briques||[]; render();
}
function render(){
  var app=document.getElementById('app');
  var h='<h2>Accès par brique</h2><div class="card"><div class="tw"><table><tr><th>Nom</th><th>Identifiant</th><th class="chkc">Admin<br>général</th>'+
    BRIQUES.map(function(b){ return '<th class="b">'+esc(b.label)+'</th>'; }).join('')+'<th class="chkc">Actif</th><th>Connexion</th><th></th></tr>';
  if(!USERS.length) h+='<tr><td colspan="'+(BRIQUES.length+6)+'" style="color:var(--mut)">Aucun compte. Crée le premier ci-dessous.</td></tr>';
  USERS.forEach(function(u){
    var self=ME&&ME.id===u.id;
    h+='<tr data-id="'+esc(u.id)+'" class="'+(u.active?'':'off')+(u.is_admin?' adm':'')+'"><td class="name"><input data-f="name" value="'+esc(u.name)+'"></td>'+
      '<td class="login">'+esc(u.login)+(self?' (toi)':'')+'</td>'+
      '<td class="chkc"><input type="checkbox" data-f="is_admin" '+(u.is_admin?'checked':'')+(self?' disabled title="Tu ne peux pas retirer tes propres droits"':'')+'></td>'+
      BRIQUES.map(function(b){ var v=(u.perms&&u.perms[b.id])||'aucun';
        return '<td class="b"><select data-b="'+b.id+'" class="l-'+(u.is_admin?'admin':v)+'"'+(u.is_admin?' disabled title="Administrateur général : tous les droits"':'')+'>'+
          LEVELS.map(function(l){ return '<option value="'+l[0]+'"'+((u.is_admin?'admin':v)===l[0]?' selected':'')+'>'+l[1]+'</option>'; }).join('')+'</select></td>'; }).join('')+
      '<td class="chkc"><input type="checkbox" data-f="active" '+(u.active?'checked':'')+(self?' disabled':'')+'></td>'+
      '<td class="login">'+esc(u.last_login?fmtDT(u.last_login):'jamais')+'</td>'+
      '<td><div class="acts"><button data-a="pass">Mot de passe</button><button data-a="out" title="Fermer toutes ses sessions ouvertes">Déconnecter</button>'+(self?'':'<button data-a="del">Supprimer</button>')+'</div></td></tr>';
  });
  h+='</table></div><div id="msg" class="msg"></div></div>';
  h+='<h2>Nouveau compte</h2><div class="card"><form class="new" id="nf" autocomplete="off">'+
    '<label>Nom affiché<input id="n-name" placeholder="ex. Constance Beernaert"></label>'+
    '<label>Identifiant<input id="n-login" placeholder="ex. constance" autocapitalize="none" required></label>'+
    '<label>Mot de passe initial<input id="n-pass" minlength="8" required></label>'+
    '<label>Droits de départ<select id="n-copy"><option value="">Aucun accès (à régler ensuite)</option>'+USERS.map(function(u){ return '<option value="'+esc(u.id)+'">Comme '+esc(u.name)+'</option>'; }).join('')+'</select></label>'+
    '<div class="acts"><button type="button" id="n-gen">Générer</button><button class="primary" type="submit">Créer le compte</button></div></form>'+
    '<p style="font-size:12px;color:var(--mut);line-height:1.6;margin:12px 0 0">Communique l\'identifiant et le mot de passe initial à la personne ; elle pourra le changer dans le module Prix fournisseurs (« Mon mot de passe »).</p></div>';
  h+='<h2>Niveaux</h2><div class="card legend">'+
    '<div><b>—</b> : la brique n\'apparaît pas dans son menu et son ouverture est refusée.</div>'+
    '<div><b>Lecture</b> : consulter (ex. historique des prix, envois de prestations, réimpressions).</div>'+
    '<div><b>Édition</b> : utiliser la brique normalement (ex. traiter des factures et écrire dans Sextan, valider et envoyer une prestation).</div>'+
    '<div><b>Admin</b> : en plus, les réglages de la brique (ex. connexion Sextan du module prix, destinataires des envois de prestation).</div>'+
    '<div><b>Admin général</b> : tous les droits sur toutes les briques, et cette page. Il en faut toujours au moins un.</div>'+
    '<div>Les changements s\'appliquent immédiatement, même aux sessions déjà ouvertes.</div></div>';
  app.innerHTML=h; bind();
}
function bind(){
  document.querySelectorAll('tr[data-id]').forEach(function(tr){
    var id=tr.dataset.id, u=USERS.find(function(x){ return x.id===id; });
    async function upd(patch,ok){ var j=await api(Object.assign({action:'update',id:id},patch)); if(!j.ok){ msg(j.error); render(); return; } Object.assign(u,j.user); render(); msg(ok,true); }
    tr.querySelector('[data-f=name]').onchange=function(){ upd({name:this.value},'Nom enregistré.'); };
    tr.querySelector('[data-f=is_admin]').onchange=function(){ upd({is_admin:this.checked}, u.login+(this.checked?' est administrateur général.':' n\'est plus administrateur général.')); };
    tr.querySelector('[data-f=active]').onchange=function(){ upd({active:this.checked}, this.checked?'Compte réactivé.':'Compte désactivé (sessions fermées).'); };
    tr.querySelectorAll('select[data-b]').forEach(function(sel){ sel.onchange=function(){
      var p=Object.assign({},u.perms); if(this.value==='aucun') delete p[this.dataset.b]; else p[this.dataset.b]=this.value;
      var b=BRIQUES.find(function(x){ return x.id===sel.dataset.b; });
      upd({perms:p}, u.login+' · '+b.label+' : '+(LEVELS.find(function(l){ return l[0]===sel.value; })[1].replace('—','aucun accès'))+'.');
    }; });
    tr.querySelector('[data-a=pass]').onclick=async function(){
      var pw=prompt('Nouveau mot de passe pour '+u.login+' (8 caractères min.) :',genPass()); if(!pw) return;
      var j=await api({action:'reset_password',id:id,password:pw}); if(j.ok) msg('Mot de passe de '+u.login+' : '+pw+' (ses sessions sont fermées).',true); else msg(j.error);
    };
    tr.querySelector('[data-a=out]').onclick=async function(){ var j=await api({action:'logout_all',id:id}); if(j.ok){ msg('Sessions de '+u.login+' fermées.',true); if(ME.id===id) BriffeAuth.logout(); } else msg(j.error); };
    var del=tr.querySelector('[data-a=del]');
    if(del) del.onclick=async function(){ if(!confirm('Supprimer définitivement le compte « '+u.login+' » ?')) return; var j=await api({action:'delete',id:id}); if(j.ok){ USERS=USERS.filter(function(x){ return x.id!==id; }); render(); msg('Compte supprimé.',true); } else msg(j.error); };
  });
  document.getElementById('n-gen').onclick=function(){ document.getElementById('n-pass').value=genPass(); };
  document.getElementById('nf').onsubmit=async function(e){
    e.preventDefault();
    var from=USERS.find(function(x){ return x.id===document.getElementById('n-copy').value; }), pw=document.getElementById('n-pass').value;
    var j=await api({action:'create',login:document.getElementById('n-login').value,name:document.getElementById('n-name').value,password:pw,is_admin:false,perms:from?from.perms:{}});
    if(!j.ok){ msg(j.error); return; }
    USERS.push(j.user); render(); msg('Compte « '+j.user.login+' » créé (mot de passe initial : '+pw+'). Règle ses accès dans le tableau.',true);
  };
}
</script>
</body>
</html>
