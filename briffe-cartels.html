<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>briffetools · cartels allergènes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:#0f0f0f;color:#e8e8e0;min-height:100vh}
button,input,select{font-family:'DM Mono',monospace}
a{color:inherit;text-decoration:none}
.header{border-bottom:1px solid #1e1e1e;padding:16px 24px;display:flex;align-items:center;gap:16px;background:#111;position:sticky;top:0;z-index:10}
.bt-back{font-size:11px;letter-spacing:.08em;color:#777;border:1px solid #2a2a2a;border-radius:3px;padding:7px 12px}
.bt-back:hover{border-color:#444;color:#ccc}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand .lk{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#444}
.brand .lk b{color:#e8e8e0;font-weight:500}
.brand .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b3242e}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font-size:11px;letter-spacing:.08em;padding:8px 14px;border-radius:3px;text-transform:uppercase;border:1px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#444;color:#ccc}
.btn.primary{border-color:#b3242e;background:#b3242e;color:#fff}
.btn.primary:hover{background:#c62a35}
.btn.small{padding:5px 9px;font-size:10px}
.btn.ghost{color:#666}
.btn:disabled{opacity:.4;cursor:not-allowed}
#import-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:#141210;border-bottom:1px solid #1e1e1e}
.ib-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#f59e0b}
#import-bar input{background:#0f0f0f;color:#e8e8e0;border:1px solid #2a2a2a;border-radius:3px;padding:8px 12px;font-size:13px;width:160px}
#import-bar input:focus{outline:none;border-color:#f59e0b}
.ib-status{font-size:11px;color:#888}
.ib-status b{color:#22c55e;font-weight:400}
.ib-status.err{color:#f87171}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.recap{font-size:12px;color:#9a9a9a;margin-bottom:14px;min-height:16px}
.recap b{color:#e8e8e0;font-weight:500}
table.list{width:100%;border-collapse:collapse}
.list th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#666;text-align:left;padding:6px 8px;border-bottom:1px solid #1e1e1e}
.list td{padding:8px;border-bottom:1px solid #161616;vertical-align:top}
.list tr:hover td{background:#131313}
.cellchk{width:28px;text-align:center}
.titin{width:100%;background:#0f0f0f;color:#e8e8e0;border:1px solid #242424;border-radius:3px;padding:7px 9px;font-size:13px}
.titin:focus{outline:none;border-color:#555}
.saved-badge{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#22c55e;margin-top:4px}
.not-found{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#f59e0b;margin-top:4px}
.algwrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:#201516;border:1px solid #3a2224;color:#f0c9cc;border-radius:12px;padding:3px 8px;font-size:11px}
.chip b{font-weight:400;color:#f3d6d8}
.chip .x{cursor:pointer;color:#c77;font-size:12px;line-height:1}
.chip .x:hover{color:#fff}
.addalg{background:#0f0f0f;color:#999;border:1px dashed #333;border-radius:12px;padding:3px 9px;font-size:11px;cursor:pointer}
.addalg:hover{border-color:#555;color:#ddd}
.algmenu{position:absolute;z-index:40;background:#161313;border:1px solid #333;border-radius:6px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.algmenu button{font-size:11px;text-align:left;padding:5px 8px;background:transparent;border:none;color:#cfcfcf;border-radius:4px;cursor:pointer}
.algmenu button:hover{background:#2a1e1f;color:#fff}
.algmenu input{grid-column:1/3;background:#0f0f0f;color:#e8e8e0;border:1px solid #2a2a2a;border-radius:4px;padding:6px 8px;font-size:11px}
.rowacts{display:flex;gap:5px;justify-content:flex-end;white-space:nowrap}
.hint{font-size:12px;color:#666;padding:24px 4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.toolbar .sp{flex:1}
.selcount{font-size:11px;color:#888;align-self:center}
/* ---- Étiquette (aperçu + impression) : 62 × 32 mm ---- */
.label{width:62mm;height:32mm;background:#fff;color:#111;padding:2.2mm 2.6mm;position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.label .lg{height:7mm;margin-bottom:1mm}
.label .lg img{height:100%;width:auto;display:block}
.label .ttl{font-weight:700;font-size:3.9mm;line-height:1.08;color:#111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label .alg{margin-top:auto;font-size:2.7mm;line-height:1.12;color:#222}
.label .alg .k{color:#921B21;font-weight:700}
.label.sm{transform:scale(.92);transform-origin:top left}
#previewwrap{position:fixed;right:18px;bottom:18px;z-index:30;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#previewwrap .pv-h{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#previewwrap .pv-h .x{cursor:pointer;color:#888}
#previewwrap .frame{border:1px dashed #444;width:62mm;height:32mm}
#printarea{display:none}
@media print{
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{display:block;position:absolute;left:0;top:0}
  .label{page-break-after:always;break-after:page}
  @page{size:62mm 32mm;margin:0}
}
</style>
</head>
<body>
<div class="header">
  <a class="bt-back" href="index.html" title="Retour au menu principal">&larr;&nbsp;Menu</a>
  <div class="brand"><span class="lk"><b>briffe</b>tools</span><span class="sub">cartels allergènes</span></div>
  <div class="header-right">
    <button class="btn" onclick="printSelected()" id="btnPrintSel">🖨️ Imprimer la sélection</button>
    <button class="btn" onclick="pdfSelected()" id="btnPdfSel">⤓ PDF de la sélection</button>
    <button class="btn" onclick="saveAll()" id="btnSaveAll">💾 Tout enregistrer</button>
  </div>
</div>

<div id="import-bar">
  <span class="ib-title">Réception Sextan</span>
  <input id="sx" type="text" placeholder="N° de réception" onkeydown="if(event.key==='Enter')loadEvent()">
  <button class="btn primary" onclick="loadEvent()">Charger les produits</button>
  <span id="ib-status" class="ib-status"></span>
</div>

<div class="wrap">
  <div class="recap" id="recap"></div>
  <div class="toolbar" id="toolbar" style="display:none">
    <button class="btn small" onclick="selectAll(true)">Tout cocher</button>
    <button class="btn small" onclick="selectAll(false)">Tout décocher</button>
    <span class="sp"></span>
    <span class="selcount" id="selcount"></span>
    <button class="btn small" onclick="addManual()">+ Produit manuel</button>
  </div>
  <div id="list"><div class="hint">Saisis un numéro de réception puis « Charger les produits » pour lister les éléments et préparer les étiquettes.</div></div>
</div>

<div id="previewwrap" style="display:none">
  <div class="pv-h"><span>Aperçu étiquette</span><span class="x" onclick="hidePreview()">✕</span></div>
  <div class="frame" id="pvframe"></div>
</div>

<div id="printarea"></div>

var ALLERGENS=["gluten","crustacés","œufs","poisson","arachide","soja","lait","fruits à coque","céleri","moutarde","sésame","sulfites","lupin","mollusques"];
var API_BASE=""; // même origine (briffetools)
var LIB={};        // bibliothèque partagée par id produit
var P=[];          // produits de la réception courante (état d'édition)
var EV=null;       // méta réception

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getPass(){ try{return sessionStorage.getItem('bt_liens_pass')||'';}catch(e){return '';} }
function setPass(p){ try{sessionStorage.setItem('bt_liens_pass',p);}catch(e){} }
function setStatus(m,kind){ var el=document.getElementById('ib-status'); el.innerHTML=m||''; el.className='ib-status'+(kind?(' '+kind):''); }

/* ---------- Chargement ---------- */
async function loadLib(){
  try{ var r=await fetch(API_BASE+'/api/cartels-lib'); if(r.ok){ var j=await r.json(); LIB=(j&&j.lib)||{}; } }catch(e){ LIB={}; }
}
async function loadEvent(){
  var id=(document.getElementById('sx').value||'').trim();
  if(!id){ setStatus('Renseigne un numéro.','err'); return; }
  setStatus('Chargement…');
  document.getElementById('list').innerHTML='<div class="hint">Chargement des produits et des allergènes…</div>';
  var j=null;
  try{ var r=await fetch(API_BASE+'/api/cartels?id='+encodeURIComponent(id)); j=await r.json().catch(()=>null);
    if(!r.ok){ setStatus('Erreur : '+((j&&j.error)||('HTTP '+r.status)),'err'); document.getElementById('list').innerHTML=''; return; }
  }catch(e){ setStatus('Serveur injoignable : '+e.message,'err'); document.getElementById('list').innerHTML=''; return; }
  EV=j.event||{};
  var prods=(j.products||[]);
  P=prods.map(function(pr){
    var lib=LIB[String(pr.id)];
    if(lib){ // corrections mémorisées -> source de vérité
      return { id:pr.id, name:lib.name||pr.name, allergens:(lib.allergens||[]).map(a=>a.name), step:pr.step||'', saved:true, found:pr.found!==false, manual:false, sel:true };
    }
    return { id:pr.id, name:pr.name, allergens:(pr.allergens||[]).map(a=>a.name), step:pr.step||'', saved:false, found:pr.found!==false, manual:false, sel:true };
  });
  var miss=P.filter(x=>!x.found).length;
  setStatus('<b>✓ Réception '+esc(EV.id)+'</b> · '+P.length+' produit(s)'+(miss?' · '+miss+' sans allergène auto':''),'');
  renderRecap(); renderList();
}
function renderRecap(){
  if(!EV){ document.getElementById('recap').innerHTML=''; return; }
  document.getElementById('recap').innerHTML='<b>'+esc(EV.name||('Réception '+EV.id))+'</b>'
    +(EV.date?' · '+esc(EV.date):'')+(EV.pax?' · '+esc(EV.pax)+' couv.':'')+(EV.client?' · '+esc(EV.client):'');
}

/* ---------- Rendu liste ---------- */
function renderList(){
  var host=document.getElementById('list');
  if(!P.length){ host.innerHTML='<div class="hint">Aucun produit à étiqueter pour cette réception.</div>'; document.getElementById('toolbar').style.display='none'; return; }
  document.getElementById('toolbar').style.display='flex';
  var h='<table class="list"><tr><th class="cellchk"></th><th style="width:34%">Intitulé</th><th>Allergènes</th><th style="width:170px"></th></tr>';
  P.forEach(function(p,i){
    h+='<tr>'
      +'<td class="cellchk"><input type="checkbox" '+(p.sel?'checked':'')+' onchange="toggleSel('+i+',this.checked)"></td>'
      +'<td><input class="titin" value="'+esc(p.name)+'" oninput="setName('+i+',this.value)">'
        +(p.saved?'<span class="saved-badge">● mémorisé</span>':'')
        +(!p.found?'<span class="not-found">allergènes à vérifier</span>':'')+'</td>'
      +'<td>'+algEditor(i,p)+'</td>'
      +'<td class="rowacts">'
        +'<button class="btn small" title="Aperçu" onclick="showPreview('+i+')">👁</button>'
        +'<button class="btn small" title="Imprimer cette étiquette" onclick="printOne('+i+')">🖨️</button>'
        +'<button class="btn small ghost" title="PDF de cette étiquette" onclick="pdfOne('+i+')">⤓</button>'
        +'<button class="btn small" title="Enregistrer dans la bibliothèque" onclick="saveOne('+i+')">💾</button>'
        +(p.manual?'<button class="btn small ghost" title="Retirer la ligne" onclick="delRow('+i+')">✕</button>':'')
      +'</td></tr>';
  });
  h+='</table>';
  host.innerHTML=h;
  updateSelCount();
}
function algEditor(i,p){
  var h='<div class="algwrap" id="alg'+i+'">';
  (p.allergens||[]).forEach(function(a,ai){
    h+='<span class="chip"><b>'+esc(a)+'</b><span class="x" title="Retirer" onclick="delAlg('+i+','+ai+')">✕</span></span>';
  });
  h+='<button class="addalg" onclick="openAlgMenu('+i+',this)">+ allergène</button>';
  h+='</div>';
  return h;
}

/* ---------- Édition ---------- */
function setName(i,v){ P[i].name=v; P[i].saved=false; syncPreview(i); }
function toggleSel(i,v){ P[i].sel=v; updateSelCount(); }
function selectAll(v){ P.forEach(p=>p.sel=v); renderList(); }
function updateSelCount(){ var n=P.filter(p=>p.sel).length; document.getElementById('selcount').textContent=n+' / '+P.length+' sélectionné(s)'; }
function delAlg(i,ai){ P[i].allergens.splice(ai,1); P[i].saved=false; renderList(); syncPreview(i); }
function addAlg(i,val){ val=String(val||'').trim(); if(!val) return; if(P[i].allergens.indexOf(val)<0) P[i].allergens.push(val); P[i].saved=false; closeAlgMenu(); renderList(); syncPreview(i); }
var _menuEl=null;
function closeAlgMenu(){ if(_menuEl){ _menuEl.remove(); _menuEl=null; } }
function openAlgMenu(i,btn){
  closeAlgMenu();
  var m=document.createElement('div'); m.className='algmenu';
  ALLERGENS.forEach(function(a){ if(P[i].allergens.indexOf(a)<0){ var b=document.createElement('button'); b.textContent=a; b.onclick=function(){ addAlg(i,a); }; m.appendChild(b); } });
  var inp=document.createElement('input'); inp.placeholder='autre… (Entrée)'; inp.onkeydown=function(e){ if(e.key==='Enter') addAlg(i,inp.value); };
  m.appendChild(inp);
  document.body.appendChild(m);
  var r=btn.getBoundingClientRect(); m.style.left=Math.min(r.left,window.innerWidth-220)+'px'; m.style.top=(r.bottom+4)+'px';
  _menuEl=m; setTimeout(()=>inp.focus(),30);
}
document.addEventListener('click',function(e){ if(_menuEl && !_menuEl.contains(e.target) && !(e.target.classList&&e.target.classList.contains('addalg'))) closeAlgMenu(); });
function addManual(){ P.push({ id:'m'+Date.now(), name:'', allergens:[], step:'', saved:false, found:true, manual:true, sel:true }); renderList(); }
function delRow(i){ P.splice(i,1); renderList(); }

/* ---------- Étiquette (HTML) ---------- */
function labelHTML(p){
  var alg=(p.allergens&&p.allergens.length)?('<span class="k">Allergènes :</span> '+p.allergens.map(esc).join(', ')):'<span class="k">Allergènes :</span> aucun des 14';
  return '<div class="label"><div class="lg"><img src="'+LOGO+'" alt=""></div>'
    +'<div class="ttl">'+esc(p.name||'')+'</div>'
    +'<div class="alg">'+alg+'</div></div>';
}

/* ---------- Aperçu flottant ---------- */
var _pvIdx=null;
function showPreview(i){ _pvIdx=i; document.getElementById('pvframe').innerHTML=labelHTML(P[i]); document.getElementById('previewwrap').style.display='block'; }
function syncPreview(i){ if(_pvIdx===i && document.getElementById('previewwrap').style.display==='block'){ document.getElementById('pvframe').innerHTML=labelHTML(P[i]); } }
function hidePreview(){ document.getElementById('previewwrap').style.display='none'; _pvIdx=null; }

/* ---------- Impression (pilote Brother) ---------- */
function printLabels(list){
  if(!list.length){ alert('Aucune étiquette à imprimer.'); return; }
  document.getElementById('printarea').innerHTML=list.map(labelHTML).join('');
  window.print();
}
function printOne(i){ printLabels([P[i]]); }
function printSelected(){ printLabels(P.filter(p=>p.sel)); }

/* ---------- Export PDF (jsPDF) ---------- */
function makePdf(list){
  if(!list.length){ alert('Aucune étiquette à exporter.'); return null; }
  var JP=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!JP){ alert('Librairie PDF indisponible.'); return null; }
  var doc=new JP({orientation:'landscape',unit:'mm',format:[62,32]});
  var W=62,H=32,mx=2.6,my=2.2;
  list.forEach(function(p,idx){
    if(idx>0) doc.addPage([62,32],'landscape');
    var lw=19, lh=lw*236/480;
    try{ doc.addImage(LOGO,'PNG',mx,my,lw,lh); }catch(e){}
    // Intitulé
    var ty=my+lh+4.4;
    doc.setTextColor(17,17,17); doc.setFont('helvetica','bold'); doc.setFontSize(12);
    var tl=doc.splitTextToSize(String(p.name||''), W-2*mx).slice(0,2);
    doc.text(tl, mx, ty);
    // Allergènes (ancrés en bas) : libellé rouge gras + liste noire, multi-lignes
    doc.setFontSize(8); doc.setFont('helvetica','bold');
    var lead=doc.getTextWidth('Allergènes : ');  // mesuré en gras (police du libellé)
    var listTxt=(p.allergens&&p.allergens.length)?p.allergens.join(', '):'aucun des 14';
    var first=doc.splitTextToSize(listTxt, W-2*mx-lead);
    var nLines=first.length;
    var ay=H-my-(nLines-1)*3.1-0.6;
    doc.setTextColor(146,27,33); doc.text('Allergènes :', mx, ay);
    doc.setTextColor(34,34,34); doc.setFont('helvetica','normal');
    doc.text(first[0]||'', mx+lead, ay);
    for(var k=1;k<first.length;k++) doc.text(first[k], mx, ay+k*3.1);
  });
  return doc;
}
function pdfOne(i){ var d=makePdf([P[i]]); if(d) d.save('cartel-'+slugify(P[i].name||P[i].id)+'.pdf'); }
function pdfSelected(){ var l=P.filter(p=>p.sel); var d=makePdf(l); if(d) d.save('cartels-'+(EV&&EV.id||'')+'.pdf'); }
function slugify(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'etiquette'; }

/* ---------- Bibliothèque partagée ---------- */
function entryOf(p){ return { name:p.name, allergens:(p.allergens||[]).map(a=>({id:null,name:a})) }; }
async function libPost(body){
  var pass=getPass();
  if(!pass){ pass=prompt('Mot de passe Briffe pour enregistrer :','')||''; if(!pass) return null; setPass(pass); }
  var r=await fetch(API_BASE+'/api/cartels-lib',{method:'POST',headers:{'Content-Type':'application/json','x-briffe-pass':pass},body:JSON.stringify(body)});
  if(r.status===401){ setPass(''); throw new Error('Mot de passe refusé'); }
  var j=await r.json().catch(()=>null);
  if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||('HTTP '+r.status));
  return j;
}
async function saveOne(i){
  var p=P[i];
  if(p.manual && (''+p.id).charAt(0)==='m' && !p.realId){ /* produit manuel sans id Sextan : clé locale */ }
  setStatus('Enregistrement de « '+esc(p.name)+' »…');
  try{ await libPost({ id:p.id, entry:entryOf(p) }); LIB[String(p.id)]=entryOf(p); p.saved=true; setStatus('<b>✓ « '+esc(p.name)+' » mémorisé</b>'); renderList(); }
  catch(e){ setStatus('Échec : '+e.message,'err'); }
}
async function saveAll(){
  if(!P.length) return;
  var entries={}; P.forEach(function(p){ entries[String(p.id)]=entryOf(p); });
  setStatus('Enregistrement de '+P.length+' produit(s)…');
  try{ var j=await libPost({ entries:entries }); P.forEach(p=>{ p.saved=true; LIB[String(p.id)]=entryOf(p); }); setStatus('<b>✓ '+P.length+' produit(s) mémorisé(s)</b> · bibliothèque : '+(j.count||'?')); renderList(); }
  catch(e){ setStatus('Échec : '+e.message,'err'); }
}

/* ---------- Init ---------- */
loadLib();
