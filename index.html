          </div>
        </div>`}
      </dialog>
    </div>`;
}


/* --------------------------------------------------------------- Journaux */
const LIB_CATEGORIE = {
  commandes:'Commandes', clients:'Clients et adresses',
  catalogue:'Catalogue', parametres:'Paramètres',
};
const LIB_ACTION = {
  creation:'Création', modification:'Modification', suppression:'Suppression',
  paiement:'Paiement', notification:'Notification',
};
// Les champs techniques ne disent rien d'utile en clair.
const CHAMPS_MASQUES = ['id','stripe_checkout_id','stripe_payment_intent_id','cgv_version'];
const LIB_CHAMP = {
  nom:'nom', prix_ht:'prix HT', actif:'actif', statut:'statut', publie:'publié',
  quantite:'quantité', remise_pct:'remise', type_compte:'type de compte',
  minimum_plateaux:'minimum de plateaux', heure_limite:'heure limite',
  zone_livraison_cp:'zone de livraison', date_livraison:'date de livraison',
  delai_paiement_jours:'délai de paiement', email_facturation:'e-mail de facturation',
  total_ttc:'total TTC', telephone:'téléphone', siret:'SIRET',
};

function valeurLisible(v){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'oui' : 'non';
  if (Array.isArray(v)) return v.join(', ');
  if (typeof v === 'object') return JSON.stringify(v);
  return LIB_STATUT[v] || String(v);
}

function Journaux(){
  const [items,setItems] = useState(null);
  const [categorie,setCategorie] = useState('toutes');
  const [depuis,setDepuis] = useState('');
  const [recherche,setRecherche] = useState('');

  const charger = useCallback(async ()=>{
    let q = sb.from('v_journal').select('*')
      .order('created_at', { ascending:false }).limit(400);
    if (categorie !== 'toutes') q = q.eq('categorie', categorie);
    if (depuis) q = q.gte('created_at', depuis);
    const { data } = await q;
    setItems(data || []);
  },[categorie, depuis]);
  useEffect(()=>{ charger(); },[charger]);

  if (!items) return html`<div class="muted">Chargement…</div>`;

  const visibles = items.filter(e => {
    const r = recherche.trim().toLowerCase();
    if (!r) return true;
    return ((e.cible || '') + ' ' + (e.categorie || '')).toLowerCase().includes(r);
  });

  // Regroupement par jour, pour que la lecture reste possible sur 400 lignes.
  const jours = [];
  visibles.forEach(e => {
    const j = new Date(e.created_at).toLocaleDateString('fr-FR',
      { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const dernier = jours[jours.length - 1];
    if (dernier && dernier.jour === j) dernier.lignes.push(e);
    else jours.push({ jour:j, lignes:[e] });
  });

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Journaux</h2>
          <div class="muted">Toutes les écritures, côté client comme côté back-office.</div>
        </div>
      </div>

      <div class="filtres">
        <label><span class="lab">Catégorie</span>
          <select value=${categorie} onChange=${e=>setCategorie(e.target.value)}>
            <option value="toutes">Toutes</option>
            ${Object.keys(LIB_CATEGORIE).map(k=>html`
              <option key=${k} value=${k}>${LIB_CATEGORIE[k]}</option>`)}
          </select></label>
        <label><span class="lab">Depuis le</span>
          <input type="date" value=${depuis} onInput=${e=>setDepuis(e.target.value)} /></label>
        <label><span class="lab">Rechercher</span>
          <input value=${recherche} placeholder="Numéro, nom…"
            onInput=${e=>setRecherche(e.target.value)} /></label>
      </div>

      ${visibles.length === 0
        ? html`<div class="empty">Aucune écriture ne correspond à ces filtres.</div>`
        : jours.map(g => html`
          <div key=${g.jour} style="margin-bottom:22px">
            <div class="eyebrow" style="margin-bottom:8px">${g.jour} — ${g.lignes.length}</div>
            ${g.lignes.map((e,i) => html`
              <div class="card" key=${e.created_at + '-' + i} style="padding:12px 16px">
                <div class="row" style="align-items:flex-start">
                  <div style="flex:1;min-width:220px">
                    <div>
                      <span class="tag">${LIB_CATEGORIE[e.categorie] || e.categorie}</span>
                      <span style="margin-left:8px">${LIB_ACTION[e.action] || e.action}</span>
                      <strong style="margin-left:6px">${e.cible}</strong>
                    </div>
                    ${e.detail && html`<div class="journal" style="margin-top:6px">
                      ${Object.keys(e.detail)
                        .filter(k => !CHAMPS_MASQUES.includes(k))
                        .slice(0, 8)
                        .map(k => html`<div class="quand" key=${k}>
                          ${e.detail[k] && e.detail[k].avant !== undefined
                            ? (LIB_CHAMP[k] || k) + ' : ' + valeurLisible(e.detail[k].avant)
                              + ' → ' + valeurLisible(e.detail[k].apres)
                            : (LIB_CHAMP[k] || k) + ' : ' + valeurLisible(e.detail[k])}
                        </div>`)}
                    </div>`}
                    ${e.detail?.a_verifier && html`
                      <div class="alerte">
                        <strong>À vérifier.</strong> ${e.detail.a_verifier}.
                      </div>`}
                  </div>
                  <div class="quand" style="flex-shrink:0">
                    ${new Date(e.created_at).toLocaleTimeString('fr-FR',
                      { hour:'2-digit', minute:'2-digit' })}
                  </div>
                </div>
              </div>`)}
          </div>`)}

      ${items.length >= 400 && html`<div class="muted" style="text-align:center">
        Seules les 400 écritures les plus récentes sont affichées. Affine les filtres.</div>`}
    </div>`;
}


/* ------------------------------------------------------------------ Équipe */
const LIB_ROLE = { admin:'Administrateur', equipe:'Équipe', client:'Client' };

function Equipe({ moi, toast }){
  const [membres,setMembres] = useState(null);
  const [candidats,setCandidats] = useState([]);
  const [referentiel,setReferentiel] = useState([]);
  const [edit,setEdit] = useState(null);
  const [recherche,setRecherche] = useState('');
  const [enCours,setEnCours] = useState(null);
  const [nouveau,setNouveau] = useState(null);
  const dlg = useRef(null);
  const dlgNouveau = useRef(null);

  const charger = useCallback(async ()=>{
    const [st, ac, pr] = await Promise.all([
      sb.rpc('lister_staff'),
      sb.rpc('lister_acces'),
      sb.from('permissions_reference').select('*').order('ordre'),
    ]);
    if (st.error) { toast('Lecture refusée : ' + st.error.message); setMembres([]); return; }
    setMembres(st.data || []);
    setCandidats((ac.data || []).filter(p => p.role === 'client'));
    setReferentiel(pr.data || []);
  },[toast]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlg); else fermerModale(dlg); },[edit]);
  useEffect(()=>{ if(nouveau) ouvrirModale(dlgNouveau); else fermerModale(dlgNouveau); },[nouveau]);

  async function basculerAcces(p, accorder){
    const nom = [p.prenom, p.nom].filter(Boolean).join(' ') || p.email;
    if (!confirm(accorder
      ? `Donner à ${nom} l'accès au back-office ?\n\n`
        + `Il démarrera avec la seule consultation des commandes ; `
        + `vous ajouterez ensuite ses permissions.`
      : `Retirer à ${nom} l'accès au back-office ?\n\n`
        + `Sa fiche du personnel et ses permissions seront supprimées.`)) return;
    setEnCours(p.id);
    const { error } = await sb.rpc('definir_acces_backoffice',
      { p_profil: p.id, p_acces: accorder });
    setEnCours(null);
    if (error) return toast('Refusé : ' + error.message);
    charger(); toast(accorder ? 'Accès accordé' : 'Accès retiré');
  }

  async function enregistrer(){
    const { error } = await sb.rpc('maj_membre', {
      p_profil: edit.id, p_prenom: edit.prenom, p_nom: edit.nom,
      p_telephone: edit.telephone || null,
      p_fonction: edit.fonction || null, p_notes: edit.notes || null,
      p_permissions: edit.modifiable ? edit.permissions : null,
      p_actif: edit.modifiable ? edit.actif : null,
    });
    if (error) return toast('Refusé : ' + error.message);
    setEdit(null); charger(); toast('Fiche enregistrée');
  }

  async function creerMembre(){
    setEnCours('nouveau'); setNouveau(n => ({ ...n, erreur:'' }));
    const { data, error } = await sb.functions.invoke('gerer-membre', {
      body: { action:'creer', email:nouveau.email.trim(), prenom:nouveau.prenom.trim(),
              nom:nouveau.nom.trim(), telephone:nouveau.telephone || null,
              fonction:nouveau.fonction || null, permissions:nouveau.permissions,
              retour: window.location.origin },
    });
    setEnCours(null);
    if (error || data?.error) {
      // Une modale s'affiche au-dessus de tout : un message hors de la fenêtre
      // resterait invisible.
      return setNouveau(n => ({ ...n, erreur: data?.error || error.message }));
    }
    setNouveau(null); charger();
    toast("Membre créé, invitation envoyée");
  }

  async function supprimerMembre(p){
    const nom = [p.prenom, p.nom].filter(Boolean).join(' ') || p.email;
    if (!confirm(`Supprimer définitivement ${nom} ?\n\n`
      + `Son compte de connexion, sa fiche et ses permissions seront effacés. `
      + `Cette action est irréversible.\n\n`
      + `Si ce membre a déjà traité des commandes, la suppression sera refusée : `
      + `retirez-lui l'accès à la place.`)) return;
    setEnCours(p.id);
    const { data, error } = await sb.functions.invoke('gerer-membre', {
      body: { action:'supprimer', profil:p.id },
    });
    setEnCours(null);
    if (error || data?.error) return toast(data?.error || error.message);
    charger(); toast('Membre supprimé');
  }

  function ouvrirFiche(p){
    setEdit({
      id:p.id, prenom:p.prenom || '', nom:p.nom || '', telephone:p.telephone || '',
      email:p.email, role:p.role, fonction:p.fonction || '', notes:p.notes || '',
      permissions:[...(p.permissions || [])], actif:p.actif,
      // Ni ses propres droits, ni ceux de l'administrateur.
      modifiable: p.role !== 'admin' && p.id !== moi.id,
    });
  }

  const basculer = cle => setEdit(e => ({ ...e,
    permissions: e.permissions.includes(cle)
      ? e.permissions.filter(x => x !== cle)
      : [...e.permissions, cle] }));

  if (!membres) return html`<div class="muted">Chargement…</div>`;

  const filtre = l => {
    const q = recherche.trim().toLowerCase();
    if (!q) return l;
    return l.filter(p => [p.prenom, p.nom, p.email, p.fonction]
      .join(' ').toLowerCase().includes(q));
  };

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Équipe</h2>
          <div class="muted">Les personnes qui travaillent dans ce back-office,
            et ce que chacune peut y faire.</div>
        </div>
        ${moi.estAdmin && html`<button class="btn" onClick=${()=>setNouveau({
          email:'', prenom:'', nom:'', telephone:'', fonction:'',
          permissions:['commandes'] })}>Nouveau membre</button>`}
      </div>

      ${!moi.estAdmin && html`<div class="muted" style="margin-bottom:16px">
        Seul le compte administrateur peut modifier les droits.</div>`}

      <div class="filtres">
        <label><span class="lab">Rechercher</span>
          <input value=${recherche} placeholder="Nom, e-mail, fonction"
            onInput=${e=>setRecherche(e.target.value)} /></label>
      </div>

      <div class="eyebrow" style="margin-bottom:8px">
        Membres de l'équipe — ${membres.length}</div>
      ${filtre(membres).map(p => html`
        <div class="card" key=${p.id}>
          <div class="row">
            <div style="flex:1;min-width:230px">
              <div style="font-weight:500">
                ${[p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom'}
                ${!p.actif && html`<span class="muted"> — désactivé</span>`}</div>
              <div class="muted">${p.fonction || 'Fonction non précisée'} · ${p.email}</div>
              <div class="tags" style="margin-top:6px">
                <span key="r" class=${'tag' + (p.role === 'admin' ? ' on' : '')}>
                  ${LIB_ROLE[p.role]}</span>
                ${p.role === 'admin'
                  ? html`<span key="p" class="tag">Tous les droits</span>`
                  : html`<span key="p" class="tag">
                      ${(p.permissions || []).length} permission${
                        (p.permissions||[]).length > 1 ? 's' : ''}</span>`}
                ${p.derniere_connexion && html`<span key="c" class="tag">
                  Vu le ${horodatage(p.derniere_connexion)}</span>`}
              </div>
              ${p.notes && html`<div class="muted" style="margin-top:4px">${p.notes}</div>`}
              ${p.role !== 'admin' && (p.permissions || []).length > 0 && html`
                <div class="muted" style="margin-top:6px">
                  ${p.permissions.map(c =>
                    (referentiel.find(r => r.cle === c) || {}).libelle || c).join(' · ')}
                </div>`}
            </div>
            <div class="actions">
              ${!moi.estAdmin
                ? html`<span class="muted">Modifiable par l'administrateur</span>`
                : html`<div style="display:flex;gap:6px;flex-wrap:wrap">
                    <button key="f" class="btn ghost"
                      onClick=${()=>ouvrirFiche(p)}>Modifier la fiche</button>
                    ${p.role !== 'admin' && html`
                      <button key="r" class="btn ghost" disabled=${enCours === p.id}
                        onClick=${()=>basculerAcces(p, false)}>Retirer l'accès</button>`}
                    ${p.role !== 'admin' && p.id !== moi.id && html`
                      <button key="s" class="btn danger" disabled=${enCours === p.id}
                        onClick=${()=>supprimerMembre(p)}>Supprimer</button>`}
                  </div>`}
            </div>
          </div>
        </div>`)}

      <div class="eyebrow" style="margin:26px 0 8px">
        Comptes clients pouvant recevoir un accès — ${candidats.length}</div>
      ${candidats.length === 0
        ? html`<div class="empty">Aucun compte client.</div>`
        : filtre(candidats).map(p => html`
          <div class="card" key=${p.id} style="padding:12px 16px">
            <div class="row" style="align-items:center">
              <div style="flex:1;min-width:200px">
                <div>${[p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom'}</div>
                <div class="muted">${p.email}${p.client ? ' · ' + p.client : ''}</div>
              </div>
              ${moi.estAdmin && html`<button class="btn ghost" disabled=${enCours === p.id}
                onClick=${()=>basculerAcces(p, true)}>Donner l'accès</button>`}
            </div>
          </div>`)}

      <dialog ref=${dlgNouveau} onClose=${()=>setNouveau(null)}>
        ${nouveau && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:6px">Nouveau membre de l'équipe</h3>
            <div class="muted" style="margin-bottom:16px">
              La personne recevra un e-mail avec un lien pour choisir son mot de passe.
              Aucun mot de passe n'est transmis en clair.
            </div>
            ${nouveau.erreur && html`<div class="err">${nouveau.erreur}</div>`}
            <label><span class="lab">Adresse e-mail</span>
              <input type="email" value=${nouveau.email}
                onInput=${e=>setNouveau({...nouveau, email:e.target.value})} /></label>
            <div class="grid2">
              <label><span class="lab">Prénom</span>
                <input value=${nouveau.prenom}
                  onInput=${e=>setNouveau({...nouveau, prenom:e.target.value})} /></label>
              <label><span class="lab">Nom</span>
                <input value=${nouveau.nom}
                  onInput=${e=>setNouveau({...nouveau, nom:e.target.value})} /></label>
            </div>
            <div class="grid2">
              <label><span class="lab">Téléphone</span>
                <input inputmode="tel" value=${nouveau.telephone}
                  onInput=${e=>setNouveau({...nouveau, telephone:e.target.value})} /></label>
              <label><span class="lab">Fonction</span>
                <input value=${nouveau.fonction} placeholder="Commerciale, chef de production…"
                  onInput=${e=>setNouveau({...nouveau, fonction:e.target.value})} /></label>
            </div>

            <div class="sep"></div>
            <span class="lab">Permissions de départ</span>
            <div>
              ${referentiel.map(r => html`
                <label key=${r.cle} style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px">
                  <input type="checkbox" style="width:auto;margin-top:3px"
                    checked=${nouveau.permissions.includes(r.cle)}
                    onChange=${()=>setNouveau(n=>({...n,
                      permissions: n.permissions.includes(r.cle)
                        ? n.permissions.filter(x=>x!==r.cle)
                        : [...n.permissions, r.cle] }))} />
                  <span>${r.libelle}
                    <span class="muted" style="display:block">${r.detail}</span></span>
                </label>`)}
            </div>
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setNouveau(null)}>Annuler</button>
            <button class="btn"
              disabled=${enCours === 'nouveau' || !nouveau.email.trim()
                || !nouveau.prenom.trim() || !nouveau.nom.trim()}
              onClick=${creerMembre}>
              ${enCours === 'nouveau' ? 'Création…' : "Créer et envoyer l'invitation"}</button>
          </div>

      </dialog>

      <dialog class="large" ref=${dlg} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:6px">Fiche du personnel</h3>
            <div class="muted" style="margin-bottom:16px">${edit.email}

            <div class="grid2">
              <label><span class="lab">Prénom</span>
                <input value=${edit.prenom}
                  onInput=${e=>setEdit({...edit, prenom:e.target.value})} /></label>
              <label><span class="lab">Nom</span>
                <input value=${edit.nom}
                  onInput=${e=>setEdit({...edit, nom:e.target.value})} /></label>
            </div>
            <div class="grid2">
              <label><span class="lab">Téléphone</span>
                <input inputmode="tel" value=${edit.telephone}
                  onInput=${e=>setEdit({...edit, telephone:e.target.value})} /></label>
              <label><span class="lab">Fonction</span>
                <input value=${edit.fonction} placeholder="Commerciale, responsable d'exploitation…"
                  onInput=${e=>setEdit({...edit, fonction:e.target.value})} /></label>
            </div>
            <label><span class="lab">Notes internes</span>
              <textarea rows="2" value=${edit.notes}
                onInput=${e=>setEdit({...edit, notes:e.target.value})}></textarea></label>
            <div class="muted" style="margin-bottom:14px">
              L'adresse e-mail sert à la connexion et ne se modifie pas ici.
            </div>

            <div class="sep"></div>
            ${!edit.modifiable && html`<div class="muted" style="margin-bottom:12px">
              ${edit.role === 'admin'
                ? "Le compte administrateur dispose de tous les droits, sans réglage possible."
                : "Vous ne pouvez pas modifier vos propres permissions."}</div>`}
            ${edit.modifiable && html`<span class="lab">Permissions</span>`}
            <div style=${edit.modifiable ? '' : 'display:none'}>
              ${referentiel.map(r => html`
                <label key=${r.cle} style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
                  <input type="checkbox" style="width:auto;margin-top:3px"
                    checked=${edit.permissions.includes(r.cle)}
                    onChange=${()=>basculer(r.cle)} />
                  <span>${r.libelle}
                    <span class="muted" style="display:block">${r.detail}</span></span>
                </label>`)}
            </div>

            ${edit.modifiable && html`<div>
              <div class="sep"></div>
              <label style="display:flex;gap:8px;align-items:center;margin:0">
                <input type="checkbox" style="width:auto" checked=${edit.actif}
                  onChange=${e=>setEdit({...edit, actif:e.target.checked})} />
                <span>Membre actif — décoché, ses permissions ne s'appliquent plus</span>
              </label>
            </div>`}
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn"
              disabled=${!edit.prenom.trim() || !edit.nom.trim()}
              onClick=${enregistrer}>Enregistrer</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}

/* --------------------------------------------------------------- Rapports */
const debutMois = d => { const x = new Date(d); x.setDate(1); return x.toISOString().slice(0,10); };
const finMois   = d => { const x = new Date(d); x.setMonth(x.getMonth()+1, 0); return x.toISOString().slice(0,10); };
const ajoutJours = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };

function Rapports({ toast }){
  const aujourdhui = new Date().toISOString().slice(0,10);
  const [debut,setDebut] = useState(debutMois(aujourdhui));
  const [fin,setFin]     = useState(finMois(aujourdhui));
  const [base,setBase]   = useState('livraison');
  const [gestionnaire,setGestionnaire] = useState('tous');
  const [client,setClient]   = useState('tous');
  const [statut,setStatut]   = useState('facturables');
  const [compte,setCompte]   = useState('tous');
  const [paiement,setPaiement] = useState('tous');
  const [source,setSource]   = useState('toutes');
  const [detail,setDetail]   = useState('gestionnaire');
  const [cmds,setCmds]       = useState(null);
  const [lignes,setLignes]   = useState([]);
  const [err,setErr]         = useState('');

  const charger = useCallback(async ()=>{
    setErr('');
    const [rc, rl] = await Promise.all([
      sb.rpc('rapport_commandes', { p_debut:debut, p_fin:fin, p_base:base }),
      sb.rpc('rapport_lignes',    { p_debut:debut, p_fin:fin, p_base:base }),
    ]);
    if (rc.error) { setErr(rc.error.message); setCmds([]); return; }
    setCmds(rc.data || []); setLignes(rl.data || []);
  },[debut, fin, base]);
  useEffect(()=>{ charger(); },[charger]);

  if (!cmds) return html`<div class="muted">Chargement…</div>`;

  // Les commandes annulées ne sont jamais du chiffre d'affaires.
  const retenue = c => {
    if (statut === 'facturables' && c.statut === 'annulee') return false;
    if (statut === 'encaissees' && !c.paye) return false;
    if (!['facturables','encaissees','toutes'].includes(statut) && c.statut !== statut) return false;
    if (gestionnaire !== 'tous'
        && (gestionnaire === 'sans' ? c.gestionnaire_id != null : c.gestionnaire_id !== gestionnaire))
      return false;
    if (client !== 'tous' && c.client_id !== client) return false;
    if (compte !== 'tous' && c.type_compte !== compte) return false;
    if (paiement !== 'tous' && c.mode_paiement !== paiement) return false;
    if (source !== 'toutes' && c.source !== source) return false;
    return true;
  };

  const visibles = cmds.filter(retenue);
  const idsRetenus = new Set(visibles.map(c => c.commande_id));
  const lignesRetenues = lignes.filter(l => idsRetenus.has(l.commande_id));

  const ht  = visibles.reduce((s,c)=>s + Number(c.total_ht), 0);
  const ttc = visibles.reduce((s,c)=>s + Number(c.total_ttc), 0);
  const plateaux = visibles.reduce((s,c)=>s + Number(c.nb_plateaux), 0);
  const frais = visibles.reduce((s,c)=>s + Number(c.frais_livraison), 0);
  const panier = visibles.length ? ht / visibles.length : 0;

  // Regroupement selon l'axe choisi
  function grouper(cle, libelle){
    const m = new Map();
    visibles.forEach(c => {
      const k = cle(c) ?? '—';
      const e = m.get(k) || { cle:k, libelle:libelle(c), nb:0, plateaux:0, ht:0, ttc:0 };
      e.nb++; e.plateaux += Number(c.nb_plateaux);
      e.ht += Number(c.total_ht); e.ttc += Number(c.total_ttc);
      m.set(k, e);
    });
    return [...m.values()].sort((a,b)=>b.ht - a.ht);
  }

  let groupes, colonne;
  if (detail === 'gestionnaire') {
    groupes = grouper(c=>c.gestionnaire_id, c=>c.gestionnaire || 'Sans gestionnaire');
    colonne = 'Gestionnaire';
  } else if (detail === 'client') {
    groupes = grouper(c=>c.client_id, c=>c.client || '—'); colonne = 'Client';
  } else if (detail === 'mois') {
    groupes = grouper(c=>(base === 'commande' ? c.date_commande : c.date_livraison).slice(0,7),
                      c=>(base === 'commande' ? c.date_commande : c.date_livraison).slice(0,7));
    groupes.sort((a,b)=>a.cle.localeCompare(b.cle)); colonne = 'Mois';
  } else {
    // Détail par plateau : on repart des lignes
    const m = new Map();
    lignesRetenues.filter(l=>l.est_plateau).forEach(l => {
      const e = m.get(l.libelle) || { cle:l.libelle, libelle:l.libelle, nb:0, plateaux:0, ht:0, ttc:0 };
      e.plateaux += l.quantite; e.ht += Number(l.montant_ht); e.nb++;
      m.set(l.libelle, e);
    });
    groupes = [...m.values()].sort((a,b)=>b.ht - a.ht); colonne = 'Plateau';
  }

  function exporter(){
    const entete = ['Numero','Date livraison','Date commande','Statut','Client','Type compte',
      'Gestionnaire','Source','Paiement','Regle','Plateaux','Frais livraison HT',
      'Total HT','TVA','Total TTC'];
    const lignesCsv = visibles.map(c => [
      c.numero, c.date_livraison, c.date_commande, c.statut, c.client, c.type_compte,
      c.gestionnaire || '', c.source, c.mode_paiement, c.paye ? 'oui' : 'non',
      c.nb_plateaux, c.frais_livraison, c.total_ht, c.total_tva, c.total_ttc,
    ]);
    // Point-virgule et BOM : Excel en français ouvre le fichier correctement.
    const csv = '\uFEFF' + [entete, ...lignesCsv]
      .map(l => l.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = `briffe-ventes-${debut}-au-${fin}.csv`;
    a.click(); URL.revokeObjectURL(url);
    toast('Export téléchargé');
  }

  const gestionnaires = [...new Map(cmds.filter(c=>c.gestionnaire_id)
    .map(c=>[c.gestionnaire_id, c.gestionnaire])).entries()];
  const clients = [...new Map(cmds.map(c=>[c.client_id, c.client])).entries()]
    .sort((a,b)=>(a[1]||'').localeCompare(b[1]||'', 'fr'));

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Rapports de ventes</h2>
          <div class="muted">
            ${visibles.length} commande${visibles.length > 1 ? 's' : ''} retenue${visibles.length > 1 ? 's' : ''}
            ${' sur ' + cmds.length + ' dans la période.'}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" onClick=${charger}>Rafraîchir</button>
          <button class="btn" disabled=${visibles.length === 0} onClick=${exporter}>
            Exporter en CSV</button>
        </div>
      </div>
      ${err && html`<div class="err">${err}</div>`}

      <div class="filtres">
        <label><span class="lab">Du</span>
          <input type="date" value=${debut} onInput=${e=>setDebut(e.target.value)} /></label>
        <label><span class="lab">Au</span>
          <input type="date" value=${fin} onInput=${e=>setFin(e.target.value)} /></label>
        <label><span class="lab">Date de référence</span>
          <select value=${base} onChange=${e=>setBase(e.target.value)}>
            <option value="livraison">Date de livraison</option>
            <option value="commande">Date de commande</option>
          </select></label>
        <label><span class="lab">Gestionnaire</span>
          <select value=${gestionnaire} onChange=${e=>setGestionnaire(e.target.value)}>
            <option value="tous">Tous</option>
            ${gestionnaires.map(([id,nom])=>html`<option key=${id} value=${id}>${nom}</option>`)}
            <option value="sans">Sans gestionnaire</option>
          </select></label>
        <label><span class="lab">Client</span>
          <select value=${client} onChange=${e=>setClient(e.target.value)}>
            <option value="tous">Tous</option>
            ${clients.map(([id,nom])=>html`<option key=${id} value=${id}>${nom}</option>`)}
          </select></label>
        <label><span class="lab">Statut</span>
          <select value=${statut} onChange=${e=>setStatut(e.target.value)}>
            <option value="facturables">Hors annulées</option>
            <option value="encaissees">Réglées seulement</option>
            <option value="toutes">Toutes</option>
            ${Object.keys(LIB_STATUT).map(k=>html`<option key=${k} value=${k}>${LIB_STATUT[k]}</option>`)}
          </select></label>
        <label><span class="lab">Type de compte</span>
          <select value=${compte} onChange=${e=>setCompte(e.target.value)}>
            <option value="tous">Tous</option>
            <option value="libre">Libre-service</option>
            <option value="mensuel">Compte mensuel</option>
          </select></label>
        <label><span class="lab">Paiement</span>
          <select value=${paiement} onChange=${e=>setPaiement(e.target.value)}>
            <option value="tous">Tous</option>
            <option value="cb">Carte</option>
            <option value="compte">Sur compte</option>
          </select></label>
        <label><span class="lab">Origine</span>
          <select value=${source} onChange=${e=>setSource(e.target.value)}>
            <option value="toutes">Toutes</option>
            <option value="portail">Portail</option>
            <option value="backoffice">Back-office</option>
          </select></label>
        <button class="btn ghost" onClick=${()=>{
          setDebut(debutMois(aujourdhui)); setFin(finMois(aujourdhui)); setBase('livraison');
          setGestionnaire('tous'); setClient('tous'); setStatut('facturables');
          setCompte('tous'); setPaiement('tous'); setSource('toutes');
        }}>Réinitialiser</button>
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
        <button key="m" class="btn ghost" onClick=${()=>{
          setDebut(debutMois(aujourdhui)); setFin(finMois(aujourdhui)); }}>Ce mois</button>
        <button key="mp" class="btn ghost" onClick=${()=>{
          const p = new Date(aujourdhui); p.setMonth(p.getMonth()-1);
          setDebut(debutMois(p)); setFin(finMois(p)); }}>Mois dernier</button>
        <button key="j30" class="btn ghost" onClick=${()=>{
          setDebut(ajoutJours(aujourdhui, -30)); setFin(aujourdhui); }}>30 derniers jours</button>
        <button key="an" class="btn ghost" onClick=${()=>{
          setDebut(aujourdhui.slice(0,4) + '-01-01'); setFin(aujourdhui.slice(0,4) + '-12-31');
        }}>Cette année</button>
      </div>

      <div class="chiffres">
        <div class="chiffre"><span class="eyebrow">Chiffre d'affaires HT</span>
          <div class="prix">${euros(ht)}</div></div>
        <div class="chiffre"><span class="eyebrow">Total TTC</span>
          <div class="prix">${euros(ttc)}</div></div>
        <div class="chiffre"><span class="eyebrow">Commandes</span>
          <div class="prix">${visibles.length}</div></div>
        <div class="chiffre"><span class="eyebrow">Plateaux</span>
          <div class="prix">${plateaux}</div></div>
        <div class="chiffre"><span class="eyebrow">Panier moyen HT</span>
          <div class="prix">${euros(panier)}</div></div>
        <div class="chiffre"><span class="eyebrow">Frais de livraison HT</span>
          <div class="prix">${euros(frais)}</div></div>
      </div>

      <div class="filtres" style="margin-top:22px">
        <label><span class="lab">Détail par</span>
          <select value=${detail} onChange=${e=>setDetail(e.target.value)}>
            <option value="gestionnaire">Gestionnaire de dossier</option>
            <option value="client">Client</option>
            <option value="plateau">Plateau</option>
            <option value="mois">Mois</option>
          </select></label>
      </div>

      ${groupes.length === 0
        ? html`<div class="empty">Aucune commande sur cette période avec ces filtres.</div>`
        : html`<div>
            ${groupes.map(g => {
              const part = ht > 0 ? (g.ht / ht) * 100 : 0;
              return html`<div class="card" key=${g.cle} style="padding:12px 16px">
                <div class="row" style="align-items:center">
                  <div style="flex:1;min-width:180px">
                    <div style="font-weight:500">${g.libelle}</div>
                    <div class="muted">${g.nb} commande${g.nb > 1 ? 's' : ''} ·
                      ${g.plateaux} plateaux · ${part.toFixed(1)} % du chiffre</div>
                    <div class="barre"><span style=${'width:' + part.toFixed(1) + '%'}></span></div>
                  </div>
                  <div style="text-align:right">
                    <div class="prix">${euros(g.ht)}</div>
                    <div class="muted">HT</div>
                  </div>
                </div>
              </div>`;
            })}
          </div>`}
    </div>`;
}


/* ------------------------------------------------------------ Codes promo */
const TYPES_PROMO = [
  { v:'pourcentage',       label:'Pourcentage' },
  { v:'montant',           label:'Montant fixe HT' },
  { v:'livraison_offerte', label:'Livraison offerte' },
];
function resumePromo(c){
  if (c.type === 'pourcentage') return '−' + Number(c.valeur).toString().replace('.', ',') + ' %';
  if (c.type === 'montant') return '−' + euros(c.valeur) + ' HT';
  return 'Livraison offerte';
}

function CodesPromo({ toast, moi }){
  const [codes,setCodes] = useState(null);
  const [usages,setUsages] = useState({});
  const [clients,setClients] = useState([]);
  const [edit,setEdit] = useState(null);
  const [filtre,setFiltre] = useState('actifs');
  const dlgPromo = useRef(null);
  const peutEcrire = moi.estAdmin || (moi.droits || []).includes('promotions');

  const charger = useCallback(async ()=>{
    const [rc, ru, rcl] = await Promise.all([
      sb.from('codes_promo').select('*').order('created_at', { ascending:false }),
      sb.from('utilisations_promo').select('code_id, remise_ht, commandes(statut)'),
      sb.from('clients').select('id, nom').order('nom'),
    ]);
    if (rc.error) { toast('Lecture refusée : ' + rc.error.message); setCodes([]); return; }
    // Les commandes annulées ne comptent pas : elles libèrent l'utilisation.
    const u = {};
    (ru.data || []).filter(x => x.commandes?.statut !== 'annulee').forEach(x => {
      const e = u[x.code_id] || { nb:0, total:0 };
      e.nb++; e.total += Number(x.remise_ht || 0);
      u[x.code_id] = e;
    });
    setCodes(rc.data || []); setUsages(u); setClients(rcl.data || []);
  },[toast]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlgPromo); else fermerModale(dlgPromo); },[edit]);

  async function enregistrer(){
    const { id, erreur, ...champs } = edit;
    champs.code = (champs.code || '').trim().toUpperCase();
    ['date_debut','date_fin','client_id','description'].forEach(k => {
      if (champs[k] === '') champs[k] = null; });
    ['minimum_ht','max_utilisations','max_par_client'].forEach(k => {
      if (champs[k] === '' || champs[k] === undefined) champs[k] = null; });
    if (champs.type === 'livraison_offerte') champs.valeur = 0;
    const r = id
      ? await sb.from('codes_promo').update(champs).eq('id', id)
      : await sb.from('codes_promo').insert({ ...champs, created_by: moi.id });
    if (r.error) {
      const m = /duplicate|unique/i.test(r.error.message) ? 'Ce code existe déjà.'
        : /check/i.test(r.error.message)
          ? 'Code invalide : 3 à 30 caractères, lettres, chiffres, tiret ou souligné.'
          : r.error.message;
      return setEdit(e => ({ ...e, erreur: m }));
    }
    setEdit(null); charger(); toast('Code enregistré');
  }

  async function basculer(c){
    const { error } = await sb.from('codes_promo').update({ actif: !c.actif }).eq('id', c.id);
    if (error) return toast('Refusé : ' + error.message);
    charger(); toast(c.actif ? 'Code désactivé' : 'Code réactivé');
  }

  async function supprimer(c){
    if (usages[c.id]?.nb) return toast(
      "Ce code a déjà servi : désactivez-le pour conserver l'historique des remises.");
    if (!confirm(`Supprimer définitivement le code ${c.code} ?`)) return;
    const { error } = await sb.from('codes_promo').delete().eq('id', c.id);
    if (error) return toast('Refusé : ' + error.message);
    charger(); toast('Code supprimé');
  }

  if (!codes) return html`<div class="muted">Chargement…</div>`;

  const aujourdhui = new Date().toISOString().slice(0,10);
  const etat = c => !c.actif ? 'inactif'
    : c.date_fin && c.date_fin < aujourdhui ? 'expire'
    : c.date_debut && c.date_debut > aujourdhui ? 'a_venir'
    : c.max_utilisations != null && (usages[c.id]?.nb || 0) >= c.max_utilisations ? 'epuise'
    : 'actif';
  const LIB_ETAT = { actif:'Actif', inactif:'Désactivé', expire:'Expiré',
                     a_venir:'À venir', epuise:'Épuisé' };
  const visibles = codes.filter(c => filtre === 'tous' || etat(c) === 'actif'
    || (filtre === 'actifs' && etat(c) === 'a_venir'));
  const totalRemises = Object.values(usages).reduce((s,u)=>s+u.total, 0);

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Codes promo</h2>
          <div class="muted">${Object.values(usages).reduce((s,u)=>s+u.nb,0)} utilisation(s),
            ${euros(totalRemises)} HT de remises accordées.</div>
        </div>
        ${peutEcrire && html`<button class="btn" onClick=${()=>setEdit({
          code:'', description:'', type:'pourcentage', valeur:10,
          date_debut:'', date_fin:'', minimum_ht:'', max_utilisations:'',
          max_par_client:1, client_id:'', premiere_commande:false, actif:true })}>
          Nouveau code</button>`}
      </div>

      <div class="filtres">
        <label><span class="lab">Afficher</span>
          <select value=${filtre} onChange=${e=>setFiltre(e.target.value)}>
            <option value="actifs">Actifs et à venir</option>
            <option value="tous">Tous</option>
          </select></label>
      </div>

      ${visibles.length === 0
        ? html`<div class="empty">Aucun code. Un code se crée en quelques secondes et
            peut être réservé à un client, limité dans le temps ou en nombre.</div>`
        : visibles.map(c => {
          const u = usages[c.id] || { nb:0, total:0 };
          const e = etat(c);
          return html`<div class="card" key=${c.id}>
            <div class="row">
              <div style="flex:1;min-width:230px">
                <div style="font-weight:600;letter-spacing:.04em">${c.code}
                  <span class="muted" style="font-weight:400"> — ${resumePromo(c)}</span></div>
                ${c.description && html`<div class="muted">${c.description}</div>`}
                <div class="tags" style="margin-top:6px">
                  <span key="e" class=${'tag' + (e === 'actif' ? ' on' : '')}>${LIB_ETAT[e]}</span>
                  <span key="u" class="tag">${u.nb}${c.max_utilisations != null
                    ? ' / ' + c.max_utilisations : ''} utilisation${u.nb > 1 ? 's' : ''}</span>
                  ${(c.date_debut || c.date_fin) && html`<span key="d" class="tag">
                    ${c.date_debut ? 'du ' + dateCourte(c.date_debut) : ''}
                    ${c.date_fin ? ' au ' + dateCourte(c.date_fin) : ''}</span>`}
                  ${c.minimum_ht != null && html`<span key="m" class="tag">
                    Dès ${euros(c.minimum_ht)} HT</span>`}
                  ${c.client_id && html`<span key="c" class="tag">
                    Réservé : ${(clients.find(x=>x.id===c.client_id)||{}).nom || 'client'}</span>`}
                  ${c.premiere_commande && html`<span key="p" class="tag">1re commande</span>`}
                </div>
              </div>
              ${peutEcrire && html`<div class="actions">
                <button key="m" class="btn ghost" onClick=${()=>setEdit({
                  ...c, date_debut:c.date_debut || '', date_fin:c.date_fin || '',
                  minimum_ht:c.minimum_ht ?? '', max_utilisations:c.max_utilisations ?? '',
                  max_par_client:c.max_par_client ?? '', client_id:c.client_id || '',
                  description:c.description || '' })}>Modifier</button>
                <button key="a" class="btn ghost" onClick=${()=>basculer(c)}>
                  ${c.actif ? 'Désactiver' : 'Réactiver'}</button>
                <button key="s" class="btn danger" onClick=${()=>supprimer(c)}>Supprimer</button>
              </div>`}
            </div>
          </div>`;
        })}

      <dialog ref=${dlgPromo} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:14px">${edit.id ? 'Modifier le code' : 'Nouveau code promo'}</h3>
            ${edit.erreur && html`<div class="err">${edit.erreur}</div>`}
            <div class="grid2">
              <label><span class="lab">Code</span>
                <input value=${edit.code} placeholder="RENTREE26"
                  style="text-transform:uppercase"
                  onInput=${e=>setEdit({...edit, code:e.target.value, erreur:''})} /></label>
              <label><span class="lab">Type</span>
                <select value=${edit.type} onChange=${e=>setEdit({...edit, type:e.target.value})}>
                  ${TYPES_PROMO.map(t=>html`<option key=${t.v} value=${t.v}>${t.label}</option>`)}
                </select></label>
            </div>
            ${edit.type !== 'livraison_offerte' && html`
              <label><span class="lab">${edit.type === 'pourcentage'
                  ? 'Réduction (%)' : 'Réduction (€ HT)'}</span>
                <input type="number" step="0.01" min="0"
                  max=${edit.type === 'pourcentage' ? 100 : undefined}
                  value=${edit.valeur}
                  onInput=${e=>setEdit({...edit, valeur:+e.target.value})} />
                <span class="muted">Calculée sur le montant des plateaux, hors frais de livraison.</span>
              </label>`}
            <label><span class="lab">Description interne</span>
              <input value=${edit.description} placeholder="Opération de rentrée, salon…"
                onInput=${e=>setEdit({...edit, description:e.target.value})} /></label>

            <div class="sep"></div>
            <span class="lab">Conditions — laisser vide pour ne pas limiter</span>
            <div class="grid2">
              <label><span class="lab">Valable du</span>
                <input type="date" value=${edit.date_debut}
                  onInput=${e=>setEdit({...edit, date_debut:e.target.value})} /></label>
              <label><span class="lab">au</span>
                <input type="date" value=${edit.date_fin}
                  onInput=${e=>setEdit({...edit, date_fin:e.target.value})} /></label>
            </div>
            <div class="grid2">
              <label><span class="lab">Montant minimum de plateaux (€ HT)</span>
                <input type="number" step="0.01" min="0" value=${edit.minimum_ht}
                  onInput=${e=>setEdit({...edit, minimum_ht:e.target.value})} /></label>
              <label><span class="lab">Utilisations au total</span>
                <input type="number" min="1" value=${edit.max_utilisations}
                  onInput=${e=>setEdit({...edit, max_utilisations:e.target.value})} /></label>
            </div>
            <div class="grid2">
              <label><span class="lab">Utilisations par client</span>
                <input type="number" min="1" value=${edit.max_par_client}
                  onInput=${e=>setEdit({...edit, max_par_client:e.target.value})} /></label>
              <label><span class="lab">Réservé à un client</span>
                <select value=${edit.client_id}
                  onChange=${e=>setEdit({...edit, client_id:e.target.value})}>
                  <option value="">Tous les clients</option>
                  ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.nom}</option>`)}
                </select></label>
            </div>
            <label style="display:flex;gap:8px;align-items:center;margin:0 0 8px">
              <input type="checkbox" style="width:auto" checked=${edit.premiere_commande}
                onChange=${e=>setEdit({...edit, premiere_commande:e.target.checked})} />
              <span>Réservé à une première commande</span>
            </label>
            <label style="display:flex;gap:8px;align-items:center;margin:0">
              <input type="checkbox" style="width:auto" checked=${edit.actif}
                onChange=${e=>setEdit({...edit, actif:e.target.checked})} />
              <span>Code actif</span>
            </label>
            <div class="muted" style="margin-top:12px">
              Un code ne se cumule jamais avec la remise négociée d'un client :
              la plus avantageuse des deux s'applique.
            </div>
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn" disabled=${!edit.code.trim()}
              onClick=${enregistrer}>Enregistrer</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}


/* ------------------------------------------------------- Boissons & extras */
function Extras({ allergenes, toast, moi }){
  const [items,setItems] = useState(null);
  const [edit,setEdit] = useState(null);
  const [envoi,setEnvoi] = useState(false);
  const dlgExtra = useRef(null);
  const peutEcrire = moi.estAdmin || (moi.droits || []).includes('catalogue');

  const charger = useCallback(async ()=>{
    const { data, error } = await sb.from('extras')
      .select('*, extra_allergenes(allergene_id)').order('ordre').order('nom');
    if (error) { toast('Lecture refusée : ' + error.message); setItems([]); return; }
    setItems(data || []);
  },[toast]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlgExtra); else fermerModale(dlgExtra); },[edit]);

  async function enregistrer(){
    setEnvoi(true);
    const { id, allerg, extra_allergenes, erreur, ...champs } = edit;
    ['description','unite','photo_url'].forEach(k => { if (champs[k] === '') champs[k] = null; });
    let cible = id;
    if (id) {
      const r = await sb.from('extras').update(champs).eq('id', id);
      if (r.error) { setEnvoi(false); return setEdit(e=>({ ...e, erreur:r.error.message })); }
    } else {
      const r = await sb.from('extras').insert(champs).select('id').single();
      if (r.error) { setEnvoi(false); return setEdit(e=>({ ...e, erreur:r.error.message })); }
      cible = r.data.id;
    }
    await sb.from('extra_allergenes').delete().eq('extra_id', cible);
    if (allerg.length) {
      await sb.from('extra_allergenes')
        .insert(allerg.map(a => ({ extra_id: cible, allergene_id: a })));
    }
    setEnvoi(false); setEdit(null); charger(); toast('Article enregistré');
  }

  async function supprimer(x){
    if (!confirm(`Supprimer « ${x.nom} » ?\n\n`
      + `Les commandes passées qui le contiennent le conservent. `
      + `Pour le retirer temporairement, désactivez-le plutôt.`)) return;
    const { error } = await sb.from('extras').delete().eq('id', x.id);
    if (error) return toast("Suppression impossible : cet article figure dans des commandes. Désactivez-le.");
    charger(); toast('Article supprimé');
  }

  async function televerser(fichier){
    if (!fichier) return;
    const chemin = 'extras/' + Date.now() + '-' + fichier.name.replace(/[^a-zA-Z0-9.]/g, '-');
    const { error } = await sb.storage.from('photos').upload(chemin, fichier, { upsert:true });
    if (error) return toast('Envoi refusé : ' + error.message);
    const { data } = sb.storage.from('photos').getPublicUrl(chemin);
    setEdit(e => ({ ...e, photo_url: data.publicUrl }));
  }

  if (!items) return html`<div class="muted">Chargement…</div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Boissons et extras</h2>
          <div class="muted">Articles vendus à côté des plateaux, indépendants des menus

                <input value=${edit.unite} placeholder="la bouteille, les 6…"

/* ------------------------------------------------ Sous-navigation d'onglet */
function SousOnglets({ pages, actif, choisir }){
  return html`
    <nav class="sous">
      ${pages.map(p => html`
        <button key=${p.k} aria-current=${actif === p.k}
          onClick=${()=>choisir(p.k)}>${p.label}</button>`)}
    </nav>`;
}

/* ------------------------------------------------------- Plateaux repas */
/* Les composants, les plateaux et les menus forment une seule offre : ils sont
   regroupes sous un onglet unique, avec une sous-navigation. */
function PlateauxRepas(props){
  const pages = [
    { k:'menus',      label:'Menus',      C:Menus },
    { k:'plateaux',   label:'Plateaux',   C:Plateaux },
    { k:'composants', label:'Composants', C:Composants },
  ];
  const [page,setPage] = useState('menus');
  const courante = pages.find(p => p.k === page) || pages[0];
  const Vue = courante.C;
  return html`
    <div>
      <${SousOnglets} pages=${pages} actif=${courante.k} choisir=${setPage} />
      <${Vue} ...${props} />
    </div>`;
}

/* ----------------------------------------------------------- PC et PDJ */
/* Petits dejeuners et pauses cafe : un catalogue permanent, sans menu ni
   periode. Une famille par sous-onglet, ses prestations en dessous. */
function Prestations({ allergenes, toast, moi }){
  const [familles,setFamilles] = useState(null);
  const [items,setItems] = useState(null);
  const [famille,setFamille] = useState(null);
  const [edit,setEdit] = useState(null);
  const [reglages,setReglages] = useState(null);
  const [envoi,setEnvoi] = useState(false);
  const dlgPresta = useRef(null);
  const dlgFamille = useRef(null);
  const peutEcrire = moi.estAdmin || (moi.droits || []).includes('catalogue');

  const charger = useCallback(async ()=>{
    const [rf, rp] = await Promise.all([
      sb.from('familles').select('*').order('ordre').order('libelle'),
      sb.from('prestations')
        .select('*, prestation_allergenes(allergene_id)').order('ordre').order('nom'),
    ]);
    if (rf.error) { toast('Lecture refusée : ' + rf.error.message); setFamilles([]); setItems([]); return; }
    if (rp.error) { toast('Lecture refusée : ' + rp.error.message); }
    setFamilles(rf.data || []);
    setItems(rp.data || []);
    setFamille(f => f || (rf.data || [])[0]?.id || null);
  },[toast]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlgPresta); else fermerModale(dlgPresta); },[edit]);
  useEffect(()=>{ if(reglages) ouvrirModale(dlgFamille); else fermerModale(dlgFamille); },[reglages]);

  async function enregistrer(){
    setEnvoi(true);
    const { id, allerg, prestation_allergenes, erreur, created_at, ...champs } = edit;
    ['description','composition','unite_libelle','photo_url']
      .forEach(k => { if (champs[k] === '') champs[k] = null; });
    let cible = id;
    if (id) {
      const r = await sb.from('prestations').update(champs).eq('id', id);
      if (r.error) { setEnvoi(false); return setEdit(e=>({ ...e, erreur:r.error.message })); }
    } else {
      const r = await sb.from('prestations').insert(champs).select('id').single();
      if (r.error) { setEnvoi(false); return setEdit(e=>({ ...e, erreur:r.error.message })); }
      cible = r.data.id;
    }
    await sb.from('prestation_allergenes').delete().eq('prestation_id', cible);
    if (allerg.length) {
      await sb.from('prestation_allergenes')
        .insert(allerg.map(a => ({ prestation_id: cible, allergene_id: a })));
    }
    setEnvoi(false); setEdit(null); charger(); toast('Prestation enregistrée');
  }

  async function enregistrerFamille(){
    setEnvoi(true);
    const { id, erreur, created_at, cle, ...champs } = reglages;
    if (champs.accroche === '') champs.accroche = null;
    const r = await sb.from('familles').update(champs).eq('id', id);
    setEnvoi(false);
    if (r.error) return setReglages(f=>({ ...f, erreur:r.error.message }));
    setReglages(null); charger(); toast('Famille enregistrée');
  }

  async function supprimer(x){
    if (!confirm(`Supprimer « ${x.nom} » ?\n\n`
      + `Les commandes passées qui la contiennent la conservent. `
      + `Pour la retirer temporairement, désactivez-la plutôt.`)) return;
    const { error } = await sb.from('prestations').delete().eq('id', x.id);
    if (error) return toast("Suppression impossible : cette prestation figure dans des commandes. Désactivez-la.");
    charger(); toast('Prestation supprimée');
  }

  async function televerser(fichier){
    if (!fichier) return;
    const chemin = 'prestations/' + Date.now() + '-' + fichier.name.replace(/[^a-zA-Z0-9.]/g, '-');
    const { error } = await sb.storage.from('photos').upload(chemin, fichier, { upsert:true });
    if (error) return toast('Envoi refusé : ' + error.message);
    const { data } = sb.storage.from('photos').getPublicUrl(chemin);
    setEdit(e => ({ ...e, photo_url: data.publicUrl }));
  }

  if (!familles || !items) return html`<div class="muted">Chargement…</div>`;
  if (familles.length === 0) return html`
    <div class="empty">Aucune famille de prestations n'est déclarée.</div>`;

  const courante = familles.find(f => f.id === famille) || familles[0];
  const liste = items.filter(x => x.famille_id === courante.id);

  return html`
    <div>
      <${SousOnglets}
        pages=${familles.map(f => ({ k:f.id, label:f.libelle }))}
        actif=${courante.id} choisir=${setFamille} />

      <div class="head">
        <div>
          <h2>${courante.libelle}${!courante.actif && html`<span class="muted"> — famille inactive</span>`}</h2>

            || "Catalogue permanent : ces prestations sont proposées toute l'année, sans menu ni période."}</div>
        </div>
        ${peutEcrire && html`<div class="actions">
          <button key="r" class="btn ghost"
            onClick=${()=>setReglages({ ...courante, accroche: courante.accroche || '' })}>
            Réglages de la famille</button>
          <button key="n" class="btn" onClick=${()=>setEdit({
            famille_id: courante.id, nom:'', description:'', composition:'',
            unite:'personne', unite_libelle:'par personne', prix_ht:'', tva_pct:5.5,
            minimum:1, ordre:(liste.length+1)*10, actif:true, photo_url:null, allerg:[] })}>
            Nouvelle prestation</button>
        </div>`}
      </div>

      ${liste.length === 0
        ? html`<div class="empty">Aucune prestation dans cette famille.
            Ajoutez-en une : elle apparaîtra côté client dès qu'elle sera active.</div>`
        : html`<div class="grille">
            ${liste.map(x => html`
              <div class="card" key=${x.id} style="padding:0;overflow:hidden">
                ${x.photo_url
                  ? html`<img key="ph" src=${x.photo_url} alt=${x.nom} class="vignette" />`
                  : html`<div key="ph" class="vignette-vide"></div>`}
                <div key="c" style="padding:14px 16px">
                  <h3>${x.nom}${!x.actif && html`<span class="muted"> — inactive</span>`}</h3>
                  ${x.unite_libelle && html`<div class="muted">${x.unite_libelle}</div>`}
                  ${x.description && html`<div class="muted">${x.description}</div>`}
                  ${x.composition && html`<div class="muted" style="margin-top:6px;font-style:italic">
                    ${x.composition}</div>`}
                  <div class="tags" style="margin:8px 0">
                    <span key="t" class="tag">TVA ${Number(x.tva_pct).toString().replace('.', ',')} %</span>
                    <span key="m" class="tag">${x.minimum > 1
                      ? `${x.minimum} ${x.unite === 'piece' ? 'pièces' : 'personnes'} minimum`
                      : 'sans minimum'}</span>
                    ${(x.prestation_allergenes || []).map(a => html`
                      <span class="tag alg" key=${a.allergene_id}>
                        ${(allergenes.find(g=>g.id===a.allergene_id)||{}).libelle || ''}</span>`)}
                  </div>
                  <div class="row" style="align-items:center">
                    <span class="prix">${euros(x.prix_ht)} <span class="muted">HT
                      ${x.unite === 'piece' ? '/ pièce' : '/ pers.'}</span></span>
                    ${peutEcrire && html`<div class="actions">
                      <button key="m" class="btn ghost" onClick=${()=>setEdit({
                        ...x, description:x.description||'', composition:x.composition||'',
                        unite_libelle:x.unite_libelle||'',
                        allerg:(x.prestation_allergenes||[]).map(a=>a.allergene_id) })}>Modifier</button>
                      <button key="s" class="btn danger" onClick=${()=>supprimer(x)}>Supprimer</button>
                    </div>`}
                  </div>
                </div>
              </div>`)}
          </div>`}

      <dialog ref=${dlgPresta} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:14px">
              ${edit.id ? 'Modifier la prestation' : 'Nouvelle prestation'}</h3>
            ${edit.erreur && html`<div class="err">${edit.erreur}</div>`}
            <label><span class="lab">Nom</span>
              <input value=${edit.nom} placeholder="Petit déjeuner continental"
                onInput=${e=>setEdit({...edit, nom:e.target.value, erreur:''})} /></label>
            <label><span class="lab">Description</span>
              <input value=${edit.description} placeholder="Pour démarrer la journée en douceur"
                onInput=${e=>setEdit({...edit, description:e.target.value})} /></label>
            <label><span class="lab">Composition</span>
              <textarea rows="3" value=${edit.composition}
                placeholder="2 viennoiseries, jus de fruits pressé, café ou thé, corbeille de fruits"
                onInput=${e=>setEdit({...edit, composition:e.target.value})}></textarea>
              <span class="muted">Détaillée au client, sous le nom de la prestation.</span>
            </label>
            <div class="grid2">
              <label><span class="lab">Vendue</span>
                <select value=${edit.unite}
                  onChange=${e=>setEdit({...edit, unite:e.target.value,
                    unite_libelle: e.target.value === 'piece' ? 'la pièce' : 'par personne' })}>
                  <option value="personne">par personne</option>
                  <option value="piece">à la pièce</option>
                </select></label>
              <label><span class="lab">Libellé de l'unité</span>
                <input value=${edit.unite_libelle} placeholder="par personne"
                  onInput=${e=>setEdit({...edit, unite_libelle:e.target.value})} />
                <span class="muted">Affiché à côté du prix.</span>
              </label>
            </div>
            <div class="grid2">
              <label><span class="lab">Prix HT (€)</span>
                <input type="number" step="0.01" min="0" value=${edit.prix_ht}
                  onInput=${e=>setEdit({...edit, prix_ht:e.target.value})} /></label>
              <label><span class="lab">TVA (%)</span>
                <input type="number" step="0.1" min="0" value=${edit.tva_pct}
                  onInput=${e=>setEdit({...edit, tva_pct:+e.target.value})} />
                <span class="muted">5,5 % à emporter, 10 % consommé sur place — à confirmer.</span>
              </label>
            </div>
            <div class="grid2">
              <label><span class="lab">Quantité minimum</span>

              </label>
              <label><span class="lab">Ordre d'affichage</span>
                <input type="number" value=${edit.ordre}

            </div>

            <span class="lab">Photo</span>
            <div class="row" style="align-items:center;margin-bottom:14px">
              ${edit.photo_url && html`<img key="ap" src=${edit.photo_url}
                style="width:80px;height:60px;object-fit:cover;border-radius:3px" />`}
              <input key="f" type="file" accept="image/*"
                onChange=${e=>televerser(e.target.files[0])} />
              ${edit.photo_url && html`<button key="r" class="btn ghost"
                onClick=${()=>setEdit({...edit, photo_url:null})}>Retirer</button>`}
            </div>

            <span class="lab">Allergènes</span>
            <div class="tags" style="margin-bottom:14px">
              ${allergenes.map(a => html`
                <button key=${a.id} type="button"
                  class=${'tag' + (edit.allerg.includes(a.id) ? ' on' : '')}
                  onClick=${()=>setEdit(e=>({ ...e,
                    allerg: e.allerg.includes(a.id)
                      ? e.allerg.filter(x=>x!==a.id) : [...e.allerg, a.id] }))}>

            <label style="display:flex;gap:8px;align-items:center;margin:0">

                onChange=${e=>setEdit({...edit, actif:e.target.checked})} />
              <span>Proposée aux clients</span>
            </label>
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn" disabled=${envoi || !edit.nom.trim() || edit.prix_ht === ''}
              onClick=${enregistrer}>${envoi ? 'Enregistrement…' : 'Enregistrer'}</button>
          </div>
        </div>`}
      </dialog>

      <dialog ref=${dlgFamille} onClose=${()=>setReglages(null)}>
        ${reglages && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:14px">Réglages — ${reglages.libelle}</h3>
            ${reglages.erreur && html`<div class="err">${reglages.erreur}</div>`}

              <input value=${reglages.libelle}

              <span class="muted">Phrase affichée au client au-dessus de la famille.</span>

            <div class="grid2">

              onClick=${enregistrerFamille}>${envoi ? 'Enregistrement…' : 'Enregistrer'}</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}

const ONGLETS = [
  { k:'commandes',   label:'Commandes',   C:Commandes,  droit:'commandes' },
  { k:'clients',     label:'Clients',     C:Clients,    droit:'clients' },
  { k:'plateaux',    label:'Plateaux repas', C:PlateauxRepas, droit:'catalogue' },
  { k:'pcpdj',       label:'PC-PDJ',      C:Prestations, droit:'catalogue' },
  { k:'extras',      label:'Boissons',    C:Extras,     droit:'catalogue' },
  { k:'parametres',  label:'Paramètres',  C:Parametres, droit:'parametres' },
  { k:'journaux',    label:'Journaux',    C:Journaux,   droit:'journaux' },
  { k:'promos',      label:'Codes promo', C:CodesPromo, droit:'promotions' },
  { k:'rapports',    label:'Rapports',    C:Rapports,   droit:'rapports' },
  { k:'equipe',      label:'Équipe',      C:Equipe,     droit:'equipe' },
];

function App(){
  const [session,setSession] = useState(undefined);
  const [profil,setProfil] = useState(null);
  const [erreurProfil,setErreurProfil] = useState(null);
  const [onglet,setOnglet] = useState('commandes');
  const [allergenes,setAllergenes] = useState([]);
  const [droits,setDroits] = useState([]);
  const [msg,setMsg] = useState('');

  const toast = t => { setMsg(t); setTimeout(()=>setMsg(''), 3200); };

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub } = sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if (!session) { setProfil(null); return; }
    (async ()=>{
      const [rp, ra, rd] = await Promise.all([
        sb.from('profils').select('*').eq('id', session.user.id).maybeSingle(),
        sb.from('allergenes').select('*').order('id'),
        sb.rpc('mes_droits'),
      ]);
      if (rp.error) {
        console.error('Lecture du profil refusée :', rp.error);
        setErreurProfil(rp.error);
      }
      const d = Array.isArray(rd.data) ? rd.data[0] : rd.data;
      setDroits(d?.permissions || []);
      setProfil(rp.data || { role:'client' });
      setAllergenes(ra.data || []);
    })();
  },[session]);

  if (session === undefined) return html`<div class="shell" style="padding-top:40px">Chargement…</div>`;
  if (!session) return html`<${Login} />`;
  if (!profil) return html`<div class="shell" style="padding-top:40px">Chargement…</div>`;

  const accesBackoffice = profil.role === 'admin' || profil.role === 'equipe';
  if (!accesBackoffice) return html`
    <div class="shell" style="padding-top:40px">
      <h2>Accès réservé</h2>
      ${erreurProfil
        ? html`<div class="err" style="margin:14px 0;white-space:pre-wrap">
             <strong>La lecture du profil a échoué.</strong><br/>
             message : ${erreurProfil.message || '—'}<br/>
             code : ${erreurProfil.code || '—'}<br/>
             détail : ${erreurProfil.details || '—'}<br/>
             indice : ${erreurProfil.hint || '—'}
           </div>`
        : html`<p class="muted">Ce compte n'a pas les droits d'administration.</p>`}
      <button class="btn ghost" onClick=${()=>sb.auth.signOut()}>Se déconnecter</button>
    </div>`;

  // Un membre ne voit que les onglets qu'il peut réellement utiliser.
  const estAdmin = profil.role === 'admin';
  const visibles = ONGLETS.filter(o => estAdmin || droits.includes(o.droit));
  const courant = visibles.find(o => o.k === onglet) || visibles[0];

  if (!courant) return html`
    <div class="shell" style="padding-top:40px">
      <h2>Aucune permission</h2>
      <div class="empty" style="margin-top:16px">
        Votre compte a accès au back-office, mais aucune permission ne lui a encore
        été attribuée. Demandez à l'administrateur de vous en accorder.
      </div>
      <button class="btn ghost" style="margin-top:16px"
        onClick=${()=>sb.auth.signOut()}>Se déconnecter</button>
    </div>`;

  const Actif = courant.C;

  return html`
    <div class="shell">
      <header class="top">
        <div style="display:flex;align-items:center;gap:12px">
          <img class="logo" src="/logo-briffe.png" alt="BRIFFE" width="196" height="96" />
          <span class="eyebrow">Back-office commandes</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="muted">${session.user.email}</span>
          <button class="btn ghost" onClick=${()=>sb.auth.signOut()}>Se déconnecter</button>
        </div>
      </header>
      <nav class="tabs">
        ${visibles.map(o=>html`
          <button key=${o.k} aria-current=${courant.k===o.k}
            onClick=${()=>setOnglet(o.k)}>${o.label}</button>`)}
      </nav>
      <${Actif} allergenes=${allergenes} toast=${toast}
        moi=${{ id: session.user.id, estAdmin, droits,
                peut: c => estAdmin || droits.includes(c) }} />
      ${msg && html`<${Message} texte=${msg} />`}
    </div>`;
}

window.__briffeOK = true;
document.getElementById('root').textContent = '';
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
