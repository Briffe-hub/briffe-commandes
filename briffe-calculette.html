<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briffe · Calculette préparation</title>
<link rel="icon" href="/briffe-tools-logo_1.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --panel:#141414; --panel2:#181818; --line:#1e1e1e; --line2:#2a2a2a;
  --ink:#e8e8e0; --mut:#8a8a82; --mut2:#5a5a56; --red:#921821; --red2:#b3242e;
  --green:#22c55e; --amber:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--ink);min-height:100vh}
input,select,button,textarea{font-family:'DM Mono',monospace}

/* header */
.header{border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;background:#111;position:sticky;top:0;z-index:20}
.bt-back{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;background:var(--panel);transition:.18s;flex:0 0 auto}
.bt-back:hover{color:var(--ink);border-color:var(--red);background:var(--panel2)}
.bt-back .ar{display:inline-block;transition:transform .18s}
.bt-back:hover .ar{transform:translateX(-3px)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{height:26px;width:auto}
.brand .sub{font-size:11px;letter-spacing:.12em;color:var(--mut2);text-transform:uppercase}
.hstatus{font-size:11px;color:var(--mut2);letter-spacing:.04em}

/* tabs */
#tab-bar{display:flex;gap:2px;padding:0 26px;background:#111;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:19}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);padding:13px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--red)}
.tab-btn:hover{color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding:22px 26px 80px}
.panel.hidden{display:none}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
select,input[type=text],input[type=number]{background:#0f0f0f;border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:9px 11px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--red)}
input[type=number]{width:90px}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:9px 14px;font-size:12px;letter-spacing:.05em;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--red);background:var(--panel2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red2)}
.btn.small{padding:6px 10px;font-size:11px}
.btn.danger{color:#ef6b6b;border-color:#3a2222}
.btn.danger:hover{background:#2a1414;border-color:var(--red)}
.status{font-size:12px;letter-spacing:.03em;color:var(--mut);min-height:16px;margin-left:6px}
.status.ok{color:var(--green)} .status.warn{color:var(--amber)} .status.err{color:#ef4444}

/* editor */
.sec{margin:18px 0 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red2);border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.grp{font-size:10px;color:var(--mut2);letter-spacing:.06em;margin:8px 0 2px 2px;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.row .lab{flex:0 1 320px;min-width:200px;display:flex;align-items:center}
.row .lab input{width:100%}
.cell{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:#0f0f0f;border:1px solid var(--line2);border-radius:9px;padding:6px 10px}
.cell .clab{font-size:8px;color:var(--mut2);letter-spacing:.14em;text-transform:uppercase}
.cell.end{margin-left:auto;background:none;border:none;padding:0;gap:14px;align-self:center}
.row select.ty{width:auto;font-size:12px;padding:8px 9px}
.cell input.p{width:86px}
.cell input.u{width:150px}
.cell input,.cell select{background:#141414}
.row .opt{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.blk{display:inline-flex;gap:6px;align-items:center}
.blk .tag{font-size:8px;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em}

/* bon */
#bon{background:#fff;color:#111;border-radius:10px;padding:26px 28px;max-width:820px;margin:14px 0 0}
#bon,#bon *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#bon .bhead{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:6px}
#bon h1{font-size:20px;margin:0;font-weight:500}
#bon .meta{font-size:12px;color:#444;text-align:right;line-height:1.6}
#bon table{width:100%;border-collapse:collapse;margin-top:10px}
#bon th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#777;text-align:left;padding:6px 6px;border-bottom:1px solid #ddd}
#bon td{font-size:13px;padding:6px 6px;border-bottom:1px solid #eee;vertical-align:top}
#bon td.q{font-weight:500;white-space:nowrap}
#bon td.note{color:#888;font-size:11px}
#bon .secrow td{background:#f3efe6;color:#111;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;border:none;padding-top:12px}
#bon .grprow td{color:#a02a2a;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:none;padding-bottom:0}
#bon .cout{margin-top:16px;padding-top:10px;border-top:1px dashed #ccc;font-size:12px;color:#333;display:flex;justify-content:space-between}
.hint{font-size:12px;color:var(--mut2);margin:8px 0}

@media print{
  body{background:#fff}
  .header,#tab-bar,.bar,.sec,.actions,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  #bon{box-shadow:none;border-radius:0;margin:0;max-width:none}
  .panel.hidden{display:none!important}
}
</style>
</head>
<body>

<div class="header">
  <a class="bt-back" href="index.html" title="Retour au menu"><span class="ar">&larr;</span>&nbsp;Menu</a>
  <div class="brand"><img src="/briffe-tools-logo_1.png" alt="briffetools"><span class="sub">Calculette préparation</span></div>
  <span class="hstatus" id="hstatus"></span>
</div>

<div id="tab-bar">
  <button class="tab-btn active" id="tb-param" onclick="showTab('param')">Paramétrage</button>
  <button class="tab-btn" id="tb-calc" onclick="showTab('calc')">Bon fictif</button>
</div>

<!-- ===================== PARAMÉTRAGE ===================== -->
<div class="wrap panel" id="panel-param">
  <div class="bar">
    <label class="fld">Client
      <select id="p-client" onchange="onClientChange()"></select>
    </label>
    <label class="fld">Prestation
      <select id="p-presta" onchange="onPrestaChange()"></select>
    </label>
    <button class="btn small" onclick="addClient()">+ Client</button>
    <button class="btn small" onclick="addPresta()">+ Prestation</button>
    <button class="btn small" onclick="renamePresta()">Renommer</button>
    <button class="btn small danger" onclick="deletePresta()">Supprimer</button>
    <span style="flex:1"></span>
    <button class="btn primary" onclick="save()">Enregistrer</button>
    <span class="status" id="p-status"></span>
  </div>
  <div id="editor"></div>
  <div class="actions" style="margin-top:14px">
    <button class="btn small" onclick="addLine()">+ Ajouter une ligne</button>
  </div>
</div>

<!-- ===================== BON FICTIF ===================== -->
<div class="wrap panel hidden" id="panel-calc">
  <div class="bar no-print">
    <label class="fld">Client
      <select id="c-client" onchange="onCalcClientChange()"></select>
    </label>
    <label class="fld">Prestation
      <select id="c-presta"></select>
    </label>
    <label class="fld">Nb personnes
      <input type="number" id="c-pax" value="30" min="1" max="2000">
    </label>
    <button class="btn primary" onclick="generate()">Générer</button>
    <button class="btn small" onclick="window.print()">Imprimer</button>
    <label class="opt" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em">
      <input type="checkbox" id="c-cout"> Afficher coût interne
    </label>
  </div>
  <div id="c-options" class="bar no-print"></div>
  <div id="bon-wrap"><div class="hint">Choisis une prestation et un nombre de personnes, puis « Générer ».</div></div>
</div>

<script>
/* ============================ MOTEUR ============================ */
let _seq=0; function uid(p){return (p||'l')+Date.now().toString(36)+(_seq++);}
function L(section,label,calc,cont,price,opts){opts=opts||{};return{id:uid(),section,label,group:opts.group||'',calc,cont,price:price||0,optional:!!opts.optional,defaultOn:opts.defaultOn!==false};}
function vol(base,pct){return{type:'vol',base,pct:pct==null?1:pct};}
function pcs(base,pct){return{type:'pcs',base,pct:pct==null?1:pct};}
function gram(base){return{type:'gram',base};}
function paxpct(pct){return{type:'paxpct',pct};}
function ratio(divisor){return{type:'ratio',divisor};}
function flag(){return{type:'flag'};}
function cap(size,unit){return{type:'cap',size,unit};}
function raw(unit,factor,decimals){return{type:'raw',unit,factor:factor||1,decimals:decimals==null?2:decimals};}
function caisse12(){return{type:'caisse12'};}
function formats(sizes){return{type:'formats',sizes:sizes||[1]};}
function boxes(sizes,unit){return{type:'boxes',sizes:sizes||[30,10],unit:unit||'Boîte'};}

function fnum(n,d){if(n==null||isNaN(n))return'';var f=Math.pow(10,d==null?2:d);var s=(Math.round(n*f)/f).toString();return s.replace('.',',');}
function ceil(x){return Math.ceil(x-1e-9);}

function computeLine(line,pax){
  var c=line.calc,ct=line.cont;
  var r={section:line.section,label:line.label,group:line.group,perPers:'',qty:'',count:0,price:+line.price||0,cost:0,note:''};
  if(c.type==='flag'){r.qty='Oui';return r;}
  var total=0;
  if(c.type==='vol'){var e=c.base*(c.pct==null?1:c.pct);total=e*pax;r.perPers=fnum(e,3)+' L/pers'+((c.pct!=null&&c.pct!=1)?(' · '+Math.round(c.pct*100)+'%'):'');}
  else if(c.type==='pcs'){var e2=c.base*(c.pct==null?1:c.pct);total=e2*pax;r.perPers=fnum(e2,2)+' /pers';}
  else if(c.type==='gram'){total=c.base*pax;r.perPers=fnum(c.base,2)+' g/pers';}
  else if(c.type==='paxpct'){total=ceil(pax*(c.pct||0));r.perPers=Math.round((c.pct||0)*100)+'% des pers';}
  else if(c.type==='ratio'){total=pax/(c.divisor||1);r.perPers='1 pour '+c.divisor+'p';}
  if(ct.type==='cap'){var n=ceil(total/(ct.size||1));r.count=n;r.qty=n+' '+(ct.unit||'');r.cost=n*r.price;}
  else if(ct.type==='raw'){var v=total/(ct.factor||1);r.count=v;r.qty=fnum(v,ct.decimals)+' '+(ct.unit||'');r.cost=v*r.price;}
  else if(ct.type==='caisse12'){var b=ceil(total);if(b>=12){var ca=ceil(b/12);r.count=ca;r.qty=ca+' caisse(s) de 12';r.note=b+' bouteilles 1L';r.cost=b*r.price;}else{r.count=b;r.qty=b+' bouteille(s) 1L';r.note='contenant au choix du livreur';r.cost=b*r.price;}}
  else if(ct.type==='formats'){var sz=(ct.sizes||[1]).slice().sort(function(a,b){return a-b;});var ch=null;for(var i=0;i<sz.length;i++){if(sz[i]>=total-1e-9){ch={n:1,s:sz[i]};break;}}if(!ch){var mx=sz[sz.length-1];ch={n:ceil(total/mx),s:mx};}r.count=ch.n;r.qty=ch.n+' × '+fnum(ch.s,2)+' L';r.cost=ch.n*r.price;}
  else if(ct.type==='boxes'){var bs=(ct.sizes||[30,10]).slice().sort(function(a,b){return b-a;});var rem=ceil(total),parts=[],tot=0;for(var k=0;k<bs.length;k++){var s2=bs[k];if(k===bs.length-1){var nn=ceil(rem/s2);if(nn>0){parts.push(nn+' × '+s2);tot+=nn;}rem=0;}else{var m=Math.floor(rem/s2);if(m>0){parts.push(m+' × '+s2);tot+=m;rem-=m*s2;}}}r.count=tot;r.qty=(parts.length?parts.join(' + '):'0')+' '+(ct.unit||'Boîte')+'(s)';r.cost=tot*r.price;}
  return r;
}

/* ============================ SEED ============================ */
function boissons(gaz){return[
  L('BOISSONS','Jus de pomme',vol(0.15,0.5),cap(1,'Bouteille 1L')),
  L('BOISSONS','Jus autres (orange, poire, multi)',vol(0.15,0.5),cap(1,'Bouteille 1L')),
  L('BOISSONS','Eau plate',vol(0.15),caisse12()),
  gaz?L('BOISSONS','Eau gazeuse',vol(0.15),caisse12()):null,
  L('BOISSONS','Lait',vol(0.005),formats([0.1,0.25,0.5,1])),
  L('BOISSONS','Café en thermos',vol(0.18,0.7),cap(1,'L (thermos)')),
  L('BOISSONS','Eau chaude (thé)',vol(0.15,0.3),cap(1,'L (thermos)')),
].filter(Boolean);}
function consommables(){return[
  L('CONSOMMABLES','Petites cuillères inox',pcs(0.5),cap(30,'Bocal (30 pièces)')),
  L('CONSOMMABLES','Sachets de thé BIO',paxpct(0.3),boxes([30,10],'Boîte')),
  L('CONSOMMABLES','Sucre',gram(2),cap(80,'Pot (80g)')),
  L('CONSOMMABLES','Serviettes en papier',pcs(0.75),cap(50,'Rack (50 pièces)')),
];}
function verrerie(){return[
  L('VERRERIE','Tasse café porcelaine',pcs(1),cap(25,'Rack (25 pièces)')),
  L('VERRERIE','Verres',pcs(1),cap(49,'Rack (49 pièces)')),
];}
function nappe(mode){return L('MATERIEL','Nappe (1 pour 50p)',ratio(50),cap(1,'unité(s)'),0,{optional:mode==='optional',defaultOn:mode!=='optional'});}
function buffetOpts(){return[
  L('MATERIEL','Buffet haut 90cm + nappe Lycra (1/50p)',ratio(50),cap(1,'unité(s)'),0,{optional:true,defaultOn:false}),
  L('MATERIEL','Mange-debout + nappe Lycra (1/50p)',ratio(50),cap(1,'unité(s)'),0,{optional:true,defaultOn:false}),
];}
function serviceOpt(){return L('OPTIONS','Service (heures à préciser)',flag(),cap(1,'—'),0,{optional:true,defaultOn:false});}
function vienn(items,per){return items.map(function(n){return L('FRAIS',n,pcs(1),cap(1,'pièce(s)'),0,{group:per});});}

function seedConfig(){
  return {clients:[
    {id:uid('c'),name:'UnivLille',prestations:[
      {id:uid('p'),name:'PDJ',lines:[].concat(boissons(false),consommables(),
        vienn(['Mini pain chocolat','Mini croissant','Madeleine'],'3 mini-viennoiseries / pers'),
        verrerie(),[nappe('optional')],buffetOpts(),[serviceOpt()])},
      {id:uid('p'),name:'PC',lines:[].concat(boissons(false),consommables(),
        vienn(['Chouquette','Financier','Mini cookie','Madeleine'],'4 mignardises / pers'),
        verrerie(),[nappe('optional')],buffetOpts(),[serviceOpt()])},
    ]},
    {id:uid('c'),name:'EuraTech',prestations:[
      {id:uid('p'),name:'PDJ Simple',lines:[].concat(boissons(true),consommables(),
        [L('FRAIS','Fruits frais',gram(80),raw('kg',1000,2))],
        vienn(['Mini pain chocolat','Mini croissant'],'2 mini-viennoiseries / pers'),
        verrerie(),[nappe('included')],buffetOpts(),[serviceOpt()])},
      {id:uid('p'),name:'PDJ élaboré & sain',lines:[].concat(boissons(true),consommables(),
        [L('FRAIS','Fruits frais',gram(80),raw('kg',1000,2)),
         L('FRAIS','Yaourt aux fruits',pcs(0.75),cap(1,'pot'),0,{group:'1 yaourt / pers'}),
         L('FRAIS','Yaourt nature',pcs(0.25),cap(1,'pot'),0,{group:'1 yaourt / pers'})],
        vienn(['Chouquette','Financier','Mini cookie'],'3 mignardises / pers'),
        verrerie(),[nappe('included')],buffetOpts(),[serviceOpt()])},
      {id:uid('p'),name:'PC Simple',lines:[].concat(boissons(true),consommables(),
        verrerie(),[nappe('included')],buffetOpts(),[serviceOpt()])},
      {id:uid('p'),name:'PC Gourmande',lines:[].concat(boissons(true),consommables(),
        vienn(['Chouquette','Financier','Mini cookie'],'3 mignardises / pers'),
        verrerie(),[nappe('included')],buffetOpts(),[serviceOpt()])},
    ]},
    {id:uid('c'),name:'SciencePo',prestations:[
      {id:uid('p'),name:'PDJ',lines:[].concat(boissons(false),consommables(),
        [L('FRAIS','Fruits frais (corbeille)',gram(120),raw('kg',1000,2))],
        vienn(['Mini pain chocolat','Mini croissant','Madeleine'],'3 mini-viennoiseries / pers'),
        verrerie(),[L('VERRERIE','Éco-cup',pcs(1),cap(1,'unité(s)'))],
        [nappe('optional')],buffetOpts(),[serviceOpt()])},
    ]},
  ]};
}

/* ============================ ÉTAT + PERSISTANCE ============================ */
var CONFIG=null, apiOK=true, sc=0, sp=0;
var SECTIONS=['BOISSONS','CONSOMMABLES','FRAIS','VERRERIE','MATERIEL','OPTIONS'];

async function loadConfig(){
  try{var r=await fetch('/api/prestations');if(!r.ok)throw 0;var j=await r.json();CONFIG=j.config;apiOK=true;}
  catch(e){apiOK=false;try{CONFIG=JSON.parse(localStorage.getItem('bt_prestations')||'null');}catch(_){CONFIG=null;}}
  if(!CONFIG||!CONFIG.clients||!CONFIG.clients.length){CONFIG=seedConfig();}
  document.getElementById('hstatus').textContent=apiOK?'Synchronisé':'Mode local';
}
async function save(){
  try{localStorage.setItem('bt_prestations',JSON.stringify(CONFIG));}catch(e){}
  if(apiOK){
    try{var r=await fetch('/api/prestations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:CONFIG})});
      if(!r.ok)throw 0;setStatus('Enregistré (serveur).','ok');}
    catch(e){setStatus('Enregistré en local (serveur indisponible).','warn');}
  } else setStatus('Enregistré en local.','warn');
}
function setStatus(t,c){var e=document.getElementById('p-status');e.textContent=t;e.className='status'+(c?' '+c:'');setTimeout(function(){if(e.textContent===t){e.textContent='';e.className='status';}},4000);}

/* ============================ NAVIGATION ============================ */
function showTab(t){
  document.getElementById('panel-param').classList.toggle('hidden',t!=='param');
  document.getElementById('panel-calc').classList.toggle('hidden',t!=='calc');
  document.getElementById('tb-param').classList.toggle('active',t==='param');
  document.getElementById('tb-calc').classList.toggle('active',t==='calc');
  if(t==='calc') syncCalcSelectors();
}
function clientOptions(sel){return CONFIG.clients.map(function(c,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');}
function prestaOptions(ci,sel){return CONFIG.clients[ci].prestations.map(function(p,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');}

function refreshSelectors(){
  document.getElementById('p-client').innerHTML=clientOptions(sc);
  document.getElementById('p-presta').innerHTML=prestaOptions(sc,sp);
}
function onClientChange(){sc=+document.getElementById('p-client').value;sp=0;refreshSelectors();renderEditor();}
function onPrestaChange(){sp=+document.getElementById('p-presta').value;renderEditor();}

/* ============================ ÉDITEUR ============================ */
function curPresta(){return CONFIG.clients[sc].prestations[sp];}
function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var CALC_TYPES=[['vol','Volume L/pers'],['pcs','Pièces /pers'],['gram','Grammes /pers'],['paxpct','% des pers'],['ratio','1 pour N'],['flag','Option (oui/non)']];
var CONT_TYPES=[['cap','Capacité'],['raw','Brut'],['caisse12','Eau (caisse 12)'],['formats','Formats'],['boxes','Boîtes']];

function selOpts(list,val){return list.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+o[1]+'</option>';}).join('');}

function calcInputs(line){
  var c=line.calc,id=line.id,h='';
  if(c.type==='vol'||c.type==='pcs'){
    h+='<span class="blk"><span class="tag">base</span><input class="p" type="number" step="0.001" value="'+(c.base==null?'':c.base)+'" data-id="'+id+'" data-f="calc.base"></span>';
    h+='<span class="blk"><span class="tag">%pers</span><input class="p" type="number" step="1" value="'+Math.round((c.pct==null?1:c.pct)*100)+'" data-id="'+id+'" data-f="calc.pctp"></span>';
  } else if(c.type==='gram'){
    h+='<span class="blk"><span class="tag">g/pers</span><input class="p" type="number" step="0.1" value="'+(c.base==null?'':c.base)+'" data-id="'+id+'" data-f="calc.base"></span>';
  } else if(c.type==='paxpct'){
    h+='<span class="blk"><span class="tag">%pers</span><input class="p" type="number" step="1" value="'+Math.round((c.pct||0)*100)+'" data-id="'+id+'" data-f="calc.pctp"></span>';
  } else if(c.type==='ratio'){
    h+='<span class="blk"><span class="tag">1 pour</span><input class="p" type="number" step="1" value="'+(c.divisor||'')+'" data-id="'+id+'" data-f="calc.divisor"></span>';
  }
  return h;
}
function contInputs(line){
  var ct=line.cont,id=line.id,h='';
  if(ct.type==='cap'){
    h+='<span class="blk"><span class="tag">taille</span><input class="p" type="number" step="0.01" value="'+(ct.size==null?'':ct.size)+'" data-id="'+id+'" data-f="cont.size"></span>';
    h+='<span class="blk"><span class="tag">unité</span><input class="u" type="text" value="'+esc(ct.unit||'')+'" data-id="'+id+'" data-f="cont.unit"></span>';
  } else if(ct.type==='raw'){
    h+='<span class="blk"><span class="tag">unité</span><input class="u" type="text" value="'+esc(ct.unit||'')+'" data-id="'+id+'" data-f="cont.unit"></span>';
    h+='<span class="blk"><span class="tag">/facteur</span><input class="p" type="number" step="1" value="'+(ct.factor||1)+'" data-id="'+id+'" data-f="cont.factor"></span>';
  } else if(ct.type==='formats'){
    h+='<span class="blk"><span class="tag">formats L</span><input class="u" type="text" value="'+esc((ct.sizes||[]).join(', '))+'" data-id="'+id+'" data-f="cont.sizes"></span>';
  } else if(ct.type==='boxes'){
    h+='<span class="blk"><span class="tag">tailles</span><input class="u" type="text" value="'+esc((ct.sizes||[]).join(', '))+'" data-id="'+id+'" data-f="cont.sizes"></span>';
    h+='<span class="blk"><span class="tag">unité</span><input class="u" type="text" value="'+esc(ct.unit||'Boîte')+'" data-id="'+id+'" data-f="cont.unit"></span>';
  }
  return h;
}

function renderEditor(){
  var p=curPresta(),host=document.getElementById('editor'),html='';
  SECTIONS.forEach(function(sec){
    var lines=p.lines.filter(function(l){return l.section===sec;});
    if(!lines.length) return;
    html+='<div class="sec"><span>'+sec+'</span></div>';
    var lastGrp='';
    lines.forEach(function(l){
      if(l.group&&l.group!==lastGrp){html+='<div class="grp">'+esc(l.group)+'</div>';lastGrp=l.group;}
      if(!l.group)lastGrp='';
      html+='<div class="row">'
        +'<span class="lab"><input type="text" value="'+esc(l.label)+'" data-id="'+l.id+'" data-f="label"></span>'
        +'<div class="cell"><span class="clab">calcul</span><select class="ty" data-id="'+l.id+'" data-f="calc.type">'+selOpts(CALC_TYPES,l.calc.type)+'</select>'+calcInputs(l)+'</div>'
        +'<div class="cell"><span class="clab">contenant</span><select class="ty" data-id="'+l.id+'" data-f="cont.type">'+selOpts(CONT_TYPES,l.cont.type)+'</select>'+contInputs(l)+'</div>'
        +'<div class="cell"><span class="clab">prix €</span><input class="p" type="number" step="0.001" value="'+(l.price||0)+'" data-id="'+l.id+'" data-f="price"></div>'
        +'<div class="cell end"><label class="opt"><input type="checkbox" '+(l.optional?'checked':'')+' data-id="'+l.id+'" data-f="optional"> option</label>'
        +'<button class="btn small danger" data-id="'+l.id+'" data-act="del">✕</button></div>'
        +'</div>';
    });
  });
  host.innerHTML=html||'<div class="hint">Aucune ligne. Ajoute-en une.</div>';
  wireEditor();
}

function findLine(id){var p=curPresta();for(var i=0;i<p.lines.length;i++)if(p.lines[i].id===id)return p.lines[i];return null;}
function setField(line,f,val){
  if(f==='label')line.label=val;
  else if(f==='price')line.price=parseFloat(val)||0;
  else if(f==='optional')line.optional=val;
  else if(f==='calc.type'){line.calc=defaultCalc(val);}
  else if(f==='cont.type'){line.cont=defaultCont(val);}
  else if(f==='calc.base')line.calc.base=parseFloat(val)||0;
  else if(f==='calc.pctp')line.calc.pct=(parseFloat(val)||0)/100;
  else if(f==='calc.divisor')line.calc.divisor=parseFloat(val)||1;
  else if(f==='cont.size')line.cont.size=parseFloat(val)||0;
  else if(f==='cont.unit')line.cont.unit=val;
  else if(f==='cont.factor')line.cont.factor=parseFloat(val)||1;
  else if(f==='cont.sizes')line.cont.sizes=val.split(',').map(function(x){return parseFloat(x.trim());}).filter(function(x){return!isNaN(x);});
}
function defaultCalc(t){if(t==='vol')return vol(0.1,1);if(t==='pcs')return pcs(1,1);if(t==='gram')return gram(1);if(t==='paxpct')return paxpct(0.3);if(t==='ratio')return ratio(50);return flag();}
function defaultCont(t){if(t==='cap')return cap(1,'unité(s)');if(t==='raw')return raw('kg',1000,2);if(t==='caisse12')return caisse12();if(t==='formats')return formats([0.1,0.25,0.5,1]);if(t==='boxes')return boxes([30,10],'Boîte');return cap(1,'unité(s)');}

function wireEditor(){
  var host=document.getElementById('editor');
  host.querySelectorAll('input,select').forEach(function(el){
    var evt=(el.type==='checkbox'||el.tagName==='SELECT')?'change':'input';
    el.addEventListener(evt,function(){
      var id=el.getAttribute('data-id'),f=el.getAttribute('data-f'),line=findLine(id);if(!line)return;
      var val=el.type==='checkbox'?el.checked:el.value;
      setField(line,f,val);
      if(f==='calc.type'||f==='cont.type') renderEditor();
    });
  });
  host.querySelectorAll('[data-act=del]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-id'),p=curPresta();
      p.lines=p.lines.filter(function(l){return l.id!==id;});renderEditor();
    });
  });
}

function addLine(){curPresta().lines.push(L('BOISSONS','Nouvel élément',pcs(1,1),cap(1,'unité(s)')));renderEditor();}
function addClient(){var n=prompt('Nom du client (nouvel appel d\'offre) :');if(!n)return;CONFIG.clients.push({id:uid('c'),name:n,prestations:[{id:uid('p'),name:'Prestation 1',lines:[].concat(boissons(false),consommables(),verrerie(),[nappe('optional')],[serviceOpt()])}]});sc=CONFIG.clients.length-1;sp=0;refreshSelectors();renderEditor();}
function addPresta(){var n=prompt('Nom de la prestation :');if(!n)return;CONFIG.clients[sc].prestations.push({id:uid('p'),name:n,lines:[].concat(boissons(false),consommables(),verrerie(),[nappe('optional')],[serviceOpt()])});sp=CONFIG.clients[sc].prestations.length-1;refreshSelectors();renderEditor();}
function renamePresta(){var p=curPresta();var n=prompt('Renommer la prestation :',p.name);if(n){p.name=n;refreshSelectors();}}
function deletePresta(){var cl=CONFIG.clients[sc];if(cl.prestations.length<=1){alert('Le client doit garder au moins une prestation. Supprime le client entier si besoin.');return;}if(!confirm('Supprimer la prestation « '+curPresta().name+' » ?'))return;cl.prestations.splice(sp,1);sp=0;refreshSelectors();renderEditor();}

/* ============================ BON FICTIF ============================ */
function syncCalcSelectors(){
  var cc=document.getElementById('c-client');
  cc.innerHTML=clientOptions(0);
  onCalcClientChange();
}
function onCalcClientChange(){
  var ci=+document.getElementById('c-client').value;
  document.getElementById('c-presta').innerHTML=prestaOptions(ci,0);
  renderOptionToggles();
}
function renderOptionToggles(){
  var ci=+document.getElementById('c-client').value,pi=+document.getElementById('c-presta').value||0;
  var p=CONFIG.clients[ci].prestations[pi]||CONFIG.clients[ci].prestations[0];
  var opts=p.lines.filter(function(l){return l.optional;});
  var host=document.getElementById('c-options');
  if(!opts.length){host.innerHTML='';return;}
  host.innerHTML='<span class="mini" style="color:var(--mut)">Options :</span>'+opts.map(function(l){
    return '<label class="opt" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)"><input type="checkbox" data-optid="'+l.id+'" '+(l.defaultOn?'checked':'')+'> '+esc(l.label)+'</label>';
  }).join('');
}

function generate(){
  var ci=+document.getElementById('c-client').value;
  var pi=+document.getElementById('c-presta').value;
  var pax=parseInt(document.getElementById('c-pax').value,10)||0;
  var showCost=document.getElementById('c-cout').checked;
  if(pax<1){document.getElementById('bon-wrap').innerHTML='<div class="hint">Indique un nombre de personnes.</div>';return;}
  var client=CONFIG.clients[ci],p=client.prestations[pi];
  var chosen={};document.querySelectorAll('#c-options input[data-optid]').forEach(function(cb){chosen[cb.getAttribute('data-optid')]=cb.checked;});
  var rows='',totalCost=0;
  SECTIONS.forEach(function(sec){
    var lines=p.lines.filter(function(l){return l.section===sec && (!l.optional || chosen[l.id]);});
    if(!lines.length)return;
    rows+='<tr class="secrow"><td colspan="3">'+sec+'</td></tr>';
    var lastGrp='';
    lines.forEach(function(l){
      if(l.group&&l.group!==lastGrp){rows+='<tr class="grprow"><td colspan="3">'+esc(l.group)+'</td></tr>';lastGrp=l.group;}
      if(!l.group)lastGrp='';
      var r=computeLine(l,pax);totalCost+=r.cost||0;
      rows+='<tr><td>'+esc(r.label)+'</td><td class="q">'+esc(r.qty)+'</td><td class="note">'+esc(r.note)+'</td></tr>';
    });
  });
  var today=new Date().toLocaleDateString('fr-FR');
  var cout=showCost?('<div class="cout"><span>Coût de revient interne (indicatif)</span><span>'+fnum(totalCost,2)+' € · '+fnum(pax?totalCost/pax:0,3)+' €/pers</span></div>'):'';
  document.getElementById('bon-wrap').innerHTML=
    '<div id="bon"><div class="bhead"><div><h1>Bon de préparation</h1><div style="font-size:13px;color:#444;margin-top:3px">'+esc(client.name)+' · '+esc(p.name)+'</div></div>'
    +'<div class="meta"><b>'+pax+' personnes</b><br>Édité le '+today+'<br><span style="color:#999">bon fictif — test</span></div></div>'
    +'<table><thead><tr><th>Élément</th><th>Quantité</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +cout+'</div>';
}

/* ============================ INIT ============================ */
document.getElementById('c-presta').addEventListener('change',renderOptionToggles);
(async function(){
  await loadConfig();
  refreshSelectors();
  renderEditor();
})();
</script>
